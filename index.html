<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Midnight Pantry</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#14111C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Midnight Pantry">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Grenze+Gotisch:wght@600&family=Metamorphous&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14111C; --surface:#1E1A29; --surface2:#262133; --border:#342C47;
    --text:#ECE8F5; --muted:#9E96B4; --faint:#6E668A;
    --accent:#B893E8; --accent-dim:#7E63B0; --accent-bg:rgba(184,147,232,0.14);
    --safe:#83C6A0; --safe-bg:rgba(131,198,160,0.15);
    --warn:#E5977C; --warn-bg:rgba(229,151,124,0.15);
    --tool:#8FB3D9; --tool-bg:rgba(143,179,217,0.15);
    --danger:#E07A8A; --gold:#E8C56B;
    --display:Georgia,'Times New Roman',serif;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{ background-color:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
    font-size:16px; line-height:1.45; padding-bottom:env(safe-area-inset-bottom); }
  #bglayer{position:fixed; inset:0; z-index:0; pointer-events:none; background-repeat:repeat; background-position:center;}
  .serif{font-family:var(--display);}
  .app{max-width:760px; margin:0 auto; min-height:100vh; position:relative; z-index:1;}

  header{ padding:22px 18px 14px; text-align:center; position:sticky; top:0; z-index:5;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, rgba(18,13,20,0.88), rgba(18,13,20,0.60));
    -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px); }
  header .title{font-family:var(--display); font-size:27px; letter-spacing:.5px; margin:0; font-weight:600;}
  header .title .moon{color:var(--accent); font-weight:400;}
  header .sub{color:var(--muted); font-size:12.5px; margin:4px 0 0; letter-spacing:.3px;}
  .settingsbtn{position:absolute; top:16px; right:12px; background:var(--surface2); border:1px solid var(--border);
    color:var(--text); font-size:12.5px; font-weight:700; padding:8px 12px; border-radius:999px; cursor:pointer; min-height:38px;}
  .settingsbtn:active{background:var(--accent-bg);}

  nav{display:flex; gap:5px; padding:10px 12px; position:sticky; top:0; z-index:4;
    background:rgba(16,12,18,0.74); -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
    border-bottom:1px solid var(--border); overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  nav::-webkit-scrollbar{display:none;}
  nav button{flex:0 0 auto; background:transparent; border:1px solid transparent; color:var(--muted);
    font-size:14px; font-weight:600; padding:10px 14px; border-radius:10px; cursor:pointer;
    min-height:44px; white-space:nowrap; transition:background .15s,color .15s;}
  nav button.active{background:var(--accent-bg); color:var(--text); border-color:var(--border);}
  @media(min-width:620px){ nav{justify-content:center;} }

  main{padding:16px 14px 90px;}
  .row{display:flex; align-items:center; gap:8px;}
  .between{justify-content:space-between;}
  .muted{color:var(--muted);} .faint{color:var(--faint);}
  h2.section{font-family:var(--display); font-size:15px; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent); margin:22px 0 10px; font-weight:600;}
  h2.section:first-child{margin-top:4px;}

  button.btn{background:var(--accent); color:#160f1f; border:none; border-radius:11px; font-size:15px; font-weight:700; padding:12px 16px; cursor:pointer; min-height:46px;}
  button.btn:active{background:var(--accent-dim);}
  button.ghost{background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:10px; font-size:14px; font-weight:600; padding:9px 12px; cursor:pointer; min-height:40px;}
  button.ghost:active{background:var(--accent-bg);}
  button.tiny{padding:6px 10px; min-height:34px; font-size:13px; border-radius:9px;}
  button.link{background:none; border:none; color:var(--accent); font-size:13px; cursor:pointer; padding:6px;}
  .iconbtn{background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:4px 8px; min-height:40px;}
  .iconbtn:active{color:var(--danger);}

  .filterbar{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:6px;}
  .chip{border:1px solid var(--border); background:var(--surface); color:var(--muted); padding:7px 12px; border-radius:999px; font-size:13px; cursor:pointer; min-height:36px; font-weight:600; transition:all .12s;}
  .chip.on{background:var(--accent-bg); color:var(--text); border-color:var(--accent-dim);}
  .chip.warn.on{background:var(--warn-bg); border-color:var(--warn); color:var(--warn);}
  .chip.tool.on{background:var(--tool-bg); border-color:var(--tool); color:var(--tool);}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:11px;}
  .cardhead{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .card .name{font-family:var(--display); font-size:18px; font-weight:600; margin:0 0 3px;}
  .starbtn{background:none; border:none; cursor:pointer; font-size:23px; line-height:1; color:var(--faint); padding:0 2px; min-height:auto; flex:none;}
  .starbtn.on{color:var(--gold);}
  .tags{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 2px;}
  .tag{font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; letter-spacing:.2px;}
  .tag.safe{background:var(--safe-bg); color:var(--safe);}
  .tag.warn{background:var(--warn-bg); color:var(--warn);}
  .tag.tool{background:var(--tool-bg); color:var(--tool);}
  .cardactions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}

  .meal-row{display:flex; align-items:center; gap:8px; padding:11px 2px; border-top:1px solid var(--border);}
  .meal-row:first-child{border-top:none;}
  .meal-row .mn{font-size:15px; font-weight:500;}
  .daysel{width:auto; min-width:98px; padding:8px 10px; font-size:14px;}

  .storegroup{margin-bottom:16px;}
  .storehead{display:flex; align-items:center; gap:8px; margin:0 0 8px;}
  .storehead .sh{font-family:var(--display); font-size:16px; font-weight:600;}
  .storehead .count{color:var(--faint); font-size:13px;}
  .gitem{display:flex; align-items:flex-start; gap:11px; padding:10px 12px; background:var(--surface); border:1px solid var(--border); border-radius:11px; margin-bottom:7px; cursor:pointer;}
  .gitem.done{opacity:.5;}
  .gitem.done .gname{text-decoration:line-through;}
  .box{width:22px; height:22px; border-radius:6px; border:2px solid var(--accent-dim); flex:none; margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--bg); font-weight:900;}
  .gitem.done .box{background:var(--accent); border-color:var(--accent);}
  .gname{font-size:15px; font-weight:600;}
  .gmeta{font-size:12.5px; color:var(--muted); margin-top:1px;}
  .gprice{font-size:12.5px; margin-top:3px; color:var(--text);}

  .product-card .cardhead{gap:4px;}
  .pricegrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:8px; margin-top:8px;}
  .pricecell{background:var(--surface2); border:1px solid var(--border); border-radius:9px; padding:7px 8px;}
  .pricecell.cheap{border-color:var(--safe); background:var(--safe-bg);}
  .pricecell .pshead{display:flex; align-items:center; justify-content:space-between; margin-bottom:3px; gap:4px;}
  .pricecell .ps{font-size:10.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.3px;}
  .pricecell input{padding:6px 7px; font-size:14px;}
  .pf-search{background:none; border:none; color:var(--accent); font-size:12px; cursor:pointer; padding:0; line-height:1; flex:none;}
  .pf-search:active{opacity:.6;}
  .linkopt{display:flex; align-items:center; gap:10px; padding:10px 8px; border-bottom:1px solid var(--border); cursor:pointer;}
  .linkopt:last-child{border-bottom:none;}
  .linkopt.sel{background:var(--accent-bg); border-radius:9px;}

  .toyhead{display:flex; justify-content:space-between; align-items:center; margin:22px 0 8px;}
  .toyhead h2.section{margin:0;}
  .toyhead .tc{font-size:12px; color:var(--faint); font-weight:600; letter-spacing:0; text-transform:none;}

  .overlay{position:fixed; inset:0; background:rgba(8,6,14,.72); z-index:20; display:flex; align-items:flex-end; justify-content:center; padding:0;}
  .sheet{background:var(--surface); border-top-left-radius:20px; border-top-right-radius:20px; width:100%; max-width:760px; max-height:92vh; overflow-y:auto; padding:18px 16px calc(24px + env(safe-area-inset-bottom)); border:1px solid var(--border);}
  @media(min-width:760px){ .overlay{align-items:center;} .sheet{border-radius:20px; max-height:88vh;} }
  .sheet h3{font-family:var(--display); font-size:20px; margin:2px 0 16px;}
  label.fld{display:block; margin-bottom:14px;}
  label.fld .lb, .lb{display:block; font-size:12.5px; color:var(--muted); font-weight:700; letter-spacing:.4px; text-transform:uppercase; margin-bottom:6px;}
  input,select,textarea{width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:12px; font-size:16px; font-family:inherit;}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  textarea{min-height:70px; resize:vertical;}
  select{appearance:none; -webkit-appearance:none;}
  .ingrow{display:grid; grid-template-columns:84px 1fr auto; gap:8px; margin-bottom:8px; align-items:start;}
  .ingrow .g2{display:grid; grid-template-columns:1fr 1fr; gap:8px; grid-column:1 / -1;}
  .ingrow input{padding:10px;}
  .ingrow .del{background:var(--surface2); border:1px solid var(--border); color:var(--danger); border-radius:9px; width:44px; min-height:44px; font-size:18px; cursor:pointer;}
  .tagpick{display:flex; gap:7px; flex-wrap:wrap;}
  .sheetactions{display:flex; gap:10px; margin-top:18px;}
  .sheetactions .btn{flex:1;}

  .optgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:10px;}
  .opt{background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:7px; min-height:auto;}
  .opt.sel{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .opt .sw{width:100%; height:46px; border-radius:8px; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); overflow:hidden; background-repeat:repeat; background-position:center;}
  .opt .dot{width:20px; height:20px; border-radius:50%; box-shadow:0 0 0 3px rgba(0,0,0,.25);}
  .opt .optname{font-size:12px; color:var(--text); font-weight:600; text-align:center; line-height:1.2;}
  .opt .fsamp{font-size:26px; color:var(--accent);}

  .empty-block{text-align:center; padding:40px 20px; color:var(--muted);}
  .empty-block .big{font-family:var(--display); font-size:19px; color:var(--text); margin-bottom:6px;}
  .fab-note{font-size:12px; color:var(--faint); text-align:center; margin-top:18px; line-height:1.5;}
  a{color:var(--accent);}

  #toast{position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px); background:var(--accent); color:#160f1f; font-weight:700; padding:11px 18px; border-radius:12px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50; font-size:14px; box-shadow:0 8px 24px rgba(0,0,0,.4);}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  @media(prefers-reduced-motion:reduce){ #toast{transition:opacity .2s;} #toast.show{transform:translateX(-50%);} }
</style>
</head>
<body>
<div id="bglayer"></div>
<div class="app">
  <header>
    <h1 class="title">The Midnight <span class="moon">Pantry</span></h1>
    <p class="sub">Meals that agree with your family — sorted, tagged &amp; shopped</p>
    <button class="settingsbtn" id="settingsBtn">⚙ Settings</button>
  </header>
  <nav id="nav">
    <button data-tab="recipes" class="active">Recipes</button>
    <button data-tab="favorites">Favorites</button>
    <button data-tab="surprise">Surprise</button>
    <button data-tab="kitchen">Kitchen</button>
    <button data-tab="week">This Week</button>
    <button data-tab="shop">Shopping</button>
    <button data-tab="products">Products</button>
  </nav>
  <main id="main"></main>
</div>

async function loadState(){
  try{ if(window.storage){ const r=await window.storage.get(KEY); if(r&&r.value) return JSON.parse(r.value); } }catch(e){}
  try{ const v=localStorage.getItem(KEY); if(v) return JSON.parse(v); }catch(e){}
  return null;
}
async function saveState(){
  const json=JSON.stringify(state);
  try{ if(window.storage) await window.storage.set(KEY, json); }catch(e){}
  try{ localStorage.setItem(KEY, json); }catch(e){}
}

}

}

/* online price lookup — RapidAPI, client-side only, key never leaves this device */
function parseMoney(s){ if(s==null||s==="") return null; const n=parseFloat(String(s).replace(/[^0-9.]/g,"")); return isNaN(n)?null:Math.round(n*100)/100; }
const LOOKUP_CACHE_TTL=12*60*60*1000; /* stretch a limited free-tier quota across repeat lookups of the same staple items */
function lookupCacheGet(store,q){
  try{ const raw=localStorage.getItem("mpLookupCache:"+store+":"+q); if(!raw) return null; const obj=JSON.parse(raw); if(Date.now()-obj.ts>LOOKUP_CACHE_TTL) return null; return obj; }catch(e){ return null; }
}
function lookupCacheSet(store,q,results){ try{ localStorage.setItem("mpLookupCache:"+store+":"+q, JSON.stringify({ts:Date.now(),results})); }catch(e){} }
const LOOKUP_PROVIDERS=[
  { store:"Amazon", host:"real-time-amazon-data.p.rapidapi.com",
    buildUrl:q=>`https://real-time-amazon-data.p.rapidapi.com/search?query=${encodeURIComponent(q)}&page=1&country=US&sort_by=RELEVANCE&product_condition=ALL&is_prime=false&deals_and_discounts=NONE`,
    parse:json=>((json&&json.data&&json.data.products)||[]).slice(0,6).map(p=>{ const price=parseMoney(p.product_price); const was=parseMoney(p.product_original_price); return { title:p.product_title, sub:p.product_byline||"", price, originalPrice:(was&&price&&was>price)?was:null, image:p.product_photo||"" }; }).filter(x=>x.title) },
  { store:"Walmart", host:"axesso-walmart-data-service.p.rapidapi.com",
    buildUrl:q=>`https://axesso-walmart-data-service.p.rapidapi.com/wlm/walmart-search-by-keyword?keyword=${encodeURIComponent(q)}&page=1&sortBy=best_match`,
    parse:json=>{ const stacks=json&&json.item&&json.item.props&&json.item.props.pageProps&&json.item.props.pageProps.initialData&&json.item.props.pageProps.initialData.searchResult&&json.item.props.pageProps.initialData.searchResult.itemStacks; const items=(stacks&&stacks[0]&&stacks[0].items)||[]; return items.slice(0,6).map(it=>{ const lines=(it.priceInfo&&it.priceInfo.priceDetails&&it.priceInfo.priceDetails.priceLines)||[]; const cur=lines.find(l=>l.lineType==="CURRENT_PRICE"); const price=(cur&&cur.values&&cur.values[0])?parseMoney(cur.values[0].value):null; const was=parseMoney(it.priceInfo&&it.priceInfo.wasPrice); return { title:it.name, sub:"", price, originalPrice:(was&&price&&was>price)?was:null, image:it.image||"" }; }).filter(x=>x.title&&x.price!=null); } },
];
async function lookupOnline(query){
  const q=(query||"").trim().toLowerCase(); if(!q) return {};
  const out={};
  await Promise.all(LOOKUP_PROVIDERS.map(async prov=>{
    if(!apiKey){ out[prov.store]={error:"No API key saved — add one in Settings."}; return; }
    const cached=lookupCacheGet(prov.store,q);
    if(cached){ out[prov.store]={results:cached.results,cached:true}; return; }
    try{
      const res=await fetch(prov.buildUrl(q),{headers:{"x-rapidapi-key":apiKey,"x-rapidapi-host":prov.host}});
      if(!res.ok){ out[prov.store]={error:`HTTP ${res.status}`}; return; }
      const json=await res.json();
      const results=prov.parse(json);
      lookupCacheSet(prov.store,q,results);
      out[prov.store]={results};
    }catch(e){ out[prov.store]={error:"Request failed"}; }
  }));
  return out;
}

async function exportBackup(){
  const payload={app:"midnightPantry",version:1,exportedAt:new Date().toISOString(),state,photos:{}};
  state.recipes.forEach(r=>{ if(r.photo&&photos[r.id]) payload.photos[r.id]=photos[r.id]; });
  const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const d=new Date(),stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const a=document.createElement("a"); a.href=url; a.download=`midnight-pantry-backup-${stamp}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast("Backup downloaded");
}
async function importBackupFile(file){
  let payload;
  try{ payload=JSON.parse(await file.text()); }catch(e){ toast("That file isn't a valid backup"); return; }
  const incoming=(payload&&payload.state&&Array.isArray(payload.state.recipes))?payload.state:payload;
  if(!incoming||!Array.isArray(incoming.recipes)){ toast("That file isn't a valid backup"); return; }
  if(!confirm("Restoring this backup will replace everything currently in the app — recipes, this week's plan, shopping list and settings. Continue?")) return;
  state=incoming;
  if(!state.appliances) state.appliances=[];
  if(!state.weekMeals) state.weekMeals=[];
  if(!state.filters) state.filters=[];
  if(!state.checked) state.checked={};
  if(!state.manual) state.manual=[];
  if(!state.products) state.products=[];
  if(!state.productLinks) state.productLinks={};
  if(!state.importedIds) state.importedIds=[];
  if(!state.theme) state.theme="crimson";
  if(!state.bg) state.bg="wallpaper";
  if(!state.font) state.font="spooky";
  Object.keys(photos).forEach(k=>delete photos[k]);
  const incomingPhotos=(payload&&payload.photos)||{};
  for(const pid of Object.keys(incomingPhotos)){ await savePhoto(pid,incomingPhotos[pid]); }
  await saveState();
  applyTheme(state.theme); applyFont(state.font); applyBg(state.bg);
  render();
  toast("Backup restored");
}

/* recipe import — paste a Pinterest pin link or any recipe page link, no key needed */
const READER_BASE="https://r.jina.ai/";
async function fetchPageHtml(url){
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),20000);
  try{
    const res=await fetch(READER_BASE+url,{headers:{"X-Return-Format":"html"},signal:ctrl.signal});
    if(!res.ok) throw new Error("HTTP "+res.status);
    return await res.text();
  } finally { clearTimeout(t); }
}
function extractMeta(html,prop){
  let m=html.match(new RegExp(`<meta[^>]*property=["']${prop}["'][^>]*content=["']([^"']*)["']`,"i"));
  if(m) return m[1];
  m=html.match(new RegExp(`<meta[^>]*content=["']([^"']*)["'][^>]*property=["']${prop}["']`,"i"));
  return m?m[1]:null;
}
function extractRecipeJsonLd(html){
  const blocks=[...html.matchAll(/<script[^>]*application\/ld\+json[^>]*>([\s\S]*?)<\/script>/gi)];
  for(const m of blocks){
    let data; try{ data=JSON.parse(m[1]); }catch(e){ continue; }
    const items=Array.isArray(data)?data:(data["@graph"]?data["@graph"]:[data]);
    for(const it of items){
      const t=it&&it["@type"];
      if(t==="Recipe"||(Array.isArray(t)&&t.includes("Recipe"))) return it;
    }
  }
  return null;
}
const ING_UNITS=["cup","cups","tsp","teaspoon","teaspoons","tbsp","tablespoon","tablespoons","oz","ounce","ounces","lb","lbs","pound","pounds","g","gram","grams","kg","ml","l","liter","liters","clove","cloves","can","cans","package","packages","pkg","pinch","pinches","dash","stick","sticks","slice","slices","head","heads","bunch","bunches","quart","quarts","pint","pints","gallon","gallons","container"];
function splitQtyName(line){
  const fracMap={"¼":" 1/4","½":" 1/2","¾":" 3/4","⅓":" 1/3","⅔":" 2/3","⅛":" 1/8","⅜":" 3/8","⅝":" 5/8","⅞":" 7/8"};
  let s=(line||"").trim().replace(/[¼½¾⅓⅔⅛⅜⅝⅞]/g,m=>fracMap[m]).trim();
  const m=s.match(/^((?:\d+\s+\d+\/\d+)|(?:\d+\/\d+)|(?:\d+(?:\.\d+)?))(\s*(?:-|–|to)\s*(?:\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?))?\s*/);
  if(!m||!m[1]) return {qty:"",name:s};
  let qty=(m[1]+(m[2]||"")).trim();
  let rest=s.slice(m[0].length).trim();
  const um=rest.match(/^([a-zA-Z]+\.?)\s+(.*)$/);
  if(um&&ING_UNITS.includes(um[1].toLowerCase().replace(/\.$/,""))){ qty+=" "+um[1]; rest=um[2]; }
  return {qty,name:rest||s};
}
function stepsFromInstructions(instr){
  const steps=[];
  function walk(x){
    if(!x) return;
    if(typeof x==="string"){ x.split(/\n+/).map(s=>s.trim()).filter(Boolean).forEach(s=>steps.push(s)); return; }
    if(Array.isArray(x)){ x.forEach(walk); return; }
    if(typeof x==="object"){
      if(Array.isArray(x.itemListElement)){ walk(x.itemListElement); return; }
      if(x.text) steps.push(String(x.text).trim());
      else if(x.name) steps.push(String(x.name).trim());
    }
  }
  walk(instr);
  return steps.filter(Boolean);
}
function imageFromJsonLd(image){
  if(!image) return "";
  if(typeof image==="string") return image;
  if(Array.isArray(image)) return imageFromJsonLd(image[0]);
  if(typeof image==="object") return image.url||"";
  return "";
}
function normalizeRecipeRecord(rec){
  const name=(rec.name||"").trim();
  const ingredients=(Array.isArray(rec.recipeIngredient)?rec.recipeIngredient:[]).map(line=>{ const s=splitQtyName(line); return {name:s.name,qty:s.qty,store:STORES[0],brand:""}; });
  const steps=stepsFromInstructions(rec.recipeInstructions);
  const instructions=steps.map((s,i)=>`${i+1}. ${s}`).join("\n");
  const photoUrl=imageFromJsonLd(rec.image);
  return {name,ingredients,instructions,photoUrl};
}
async function importRecipeFromUrl(rawUrl){
  let url=(rawUrl||"").trim();
  if(!url) throw new Error("Paste a link first");
  if(!/^https?:\/\//i.test(url)) url="https://"+url;
  const isPinterest=/(^|\.)pinterest\.[a-z.]+\/pin\//i.test(url);
  const html=await fetchPageHtml(url);
  let rec=extractRecipeJsonLd(html);
  if(isPinterest){
    const seeAlso=extractMeta(html,"og:see_also");
    if(seeAlso){
      try{
        const html2=await fetchPageHtml(seeAlso);
        const rec2=extractRecipeJsonLd(html2);
        if(rec2&&Array.isArray(rec2.recipeInstructions)&&rec2.recipeInstructions.length) rec=rec2;
        else if(rec2&&!rec) rec=rec2;
      }catch(e){ /* keep whatever pinterest gave us */ }
    }
  }
  if(rec){
    const norm=normalizeRecipeRecord(rec);
    if(!norm.photoUrl){ const og=extractMeta(html,"og:image"); if(og) norm.photoUrl=og; }
    return {...norm, pinterest:url, partial:false};
  }
  const ogTitle=extractMeta(html,"og:title")||"";
  const ogImage=extractMeta(html,"og:image")||"";
  return {name:ogTitle.split(/\s[|\-–]\s/)[0].trim(),ingredients:[],instructions:"",photoUrl:ogImage,pinterest:url,partial:true};
}

/* recipe import from a photo — Gemini vision, client-side only, key never leaves this device */
async function scanRecipePhoto(dataUri){
  if(!geminiKey) throw new Error("No Gemini API key saved — add one in Settings.");
  const comma=dataUri.indexOf(","); const base64=comma>=0?dataUri.slice(comma+1):dataUri;
  const schema={type:"OBJECT",properties:{name:{type:"STRING"},ingredients:{type:"ARRAY",items:{type:"STRING"}},instructions:{type:"ARRAY",items:{type:"STRING"}}},required:["name","ingredients","instructions"]};
  const body={
    contents:[{parts:[
      {text:"Extract the cooking recipe shown in this image (it may be a photo of a recipe card, a cookbook page, a screenshot, or a snippet of a webpage). Read all visible text carefully. Return the recipe title, the complete ingredient list (each ingredient as its own string, including its quantity), and the step-by-step instructions (each step as its own string, in order). If part of the recipe isn't visible or legible, leave that part empty rather than guessing. Ignore unrelated page content like ads, navigation, or comments."},
      {inlineData:{mimeType:"image/jpeg",data:base64}}
    ]}],
    generationConfig:{responseMimeType:"application/json",responseSchema:schema}
  };
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),30000);
  let res;
  try{
    res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",{
      method:"POST", headers:{"Content-Type":"application/json","x-goog-api-key":geminiKey}, body:JSON.stringify(body), signal:ctrl.signal
    });
  } finally { clearTimeout(t); }
  if(!res.ok){ let msg="HTTP "+res.status; try{ const j=await res.json(); if(j&&j.error&&j.error.message) msg=j.error.message; }catch(e){} throw new Error(msg); }
  const json=await res.json();
  const text=json&&json.candidates&&json.candidates[0]&&json.candidates[0].content&&json.candidates[0].content.parts&&json.candidates[0].content.parts[0]&&json.candidates[0].content.parts[0].text;
  if(!text) throw new Error("The model didn't return a recipe");
  let parsed; try{ parsed=JSON.parse(text); }catch(e){ throw new Error("Couldn't understand the model's response"); }
  return parsed;
}
