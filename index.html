<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Midnight Pantry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Grenze+Gotisch:wght@600&family=Metamorphous&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14111C; --surface:#1E1A29; --surface2:#262133; --border:#342C47;
    --text:#ECE8F5; --muted:#9E96B4; --faint:#6E668A;
    --accent:#B893E8; --accent-dim:#7E63B0; --accent-bg:rgba(184,147,232,0.14);
    --safe:#83C6A0; --safe-bg:rgba(131,198,160,0.15);
    --warn:#E5977C; --warn-bg:rgba(229,151,124,0.15);
    --tool:#8FB3D9; --tool-bg:rgba(143,179,217,0.15);
    --danger:#E07A8A; --gold:#E8C56B;
    --display:Georgia,'Times New Roman',serif;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{ background-color:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
    font-size:16px; line-height:1.45; padding-bottom:env(safe-area-inset-bottom); }
  #bglayer{position:fixed; inset:0; z-index:0; pointer-events:none; background-repeat:repeat; background-position:center;}
  .serif{font-family:var(--display);}
  .app{max-width:760px; margin:0 auto; min-height:100vh; position:relative; z-index:1;}

  header{ padding:22px 18px 14px; text-align:center; position:sticky; top:0; z-index:5;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, rgba(18,13,20,0.88), rgba(18,13,20,0.60));
    -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px); }
  header .title{font-family:var(--display); font-size:27px; letter-spacing:.5px; margin:0; font-weight:600;}
  header .title .moon{color:var(--accent); font-weight:400;}
  header .sub{color:var(--muted); font-size:12.5px; margin:4px 0 0; letter-spacing:.3px;}
  .settingsbtn{position:absolute; top:16px; right:12px; background:var(--surface2); border:1px solid var(--border);
    color:var(--text); font-size:12.5px; font-weight:700; padding:8px 12px; border-radius:999px; cursor:pointer; min-height:38px;}
  .settingsbtn:active{background:var(--accent-bg);}

  nav{display:flex; gap:5px; padding:10px 12px; position:sticky; top:0; z-index:4;
    background:rgba(16,12,18,0.74); -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
    border-bottom:1px solid var(--border); overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  nav::-webkit-scrollbar{display:none;}
  nav button{flex:0 0 auto; background:transparent; border:1px solid transparent; color:var(--muted);
    font-size:14px; font-weight:600; padding:10px 14px; border-radius:10px; cursor:pointer;
    min-height:44px; white-space:nowrap; transition:background .15s,color .15s;}
  nav button.active{background:var(--accent-bg); color:var(--text); border-color:var(--border);}
  @media(min-width:620px){ nav{justify-content:center;} }

  main{padding:16px 14px 90px;}
  .row{display:flex; align-items:center; gap:8px;}
  .between{justify-content:space-between;}
  .muted{color:var(--muted);} .faint{color:var(--faint);}
  h2.section{font-family:var(--display); font-size:15px; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent); margin:22px 0 10px; font-weight:600;}
  h2.section:first-child{margin-top:4px;}

  button.btn{background:var(--accent); color:#160f1f; border:none; border-radius:11px; font-size:15px; font-weight:700; padding:12px 16px; cursor:pointer; min-height:46px;}
  button.btn:active{background:var(--accent-dim);}
  button.ghost{background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:10px; font-size:14px; font-weight:600; padding:9px 12px; cursor:pointer; min-height:40px;}
  button.ghost:active{background:var(--accent-bg);}
  button.tiny{padding:6px 10px; min-height:34px; font-size:13px; border-radius:9px;}
  button.link{background:none; border:none; color:var(--accent); font-size:13px; cursor:pointer; padding:6px;}
  .iconbtn{background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:4px 8px; min-height:40px;}
  .iconbtn:active{color:var(--danger);}

  .filterbar{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:6px;}
  .chip{border:1px solid var(--border); background:var(--surface); color:var(--muted); padding:7px 12px; border-radius:999px; font-size:13px; cursor:pointer; min-height:36px; font-weight:600; transition:all .12s;}
  .chip.on{background:var(--accent-bg); color:var(--text); border-color:var(--accent-dim);}
  .chip.warn.on{background:var(--warn-bg); border-color:var(--warn); color:var(--warn);}
  .chip.tool.on{background:var(--tool-bg); border-color:var(--tool); color:var(--tool);}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:11px;}
  .cardhead{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .card .name{font-family:var(--display); font-size:18px; font-weight:600; margin:0 0 3px;}
  .starbtn{background:none; border:none; cursor:pointer; font-size:23px; line-height:1; color:var(--faint); padding:0 2px; min-height:auto; flex:none;}
  .starbtn.on{color:var(--gold);}
  .tags{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 2px;}
  .tag{font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; letter-spacing:.2px;}
  .tag.safe{background:var(--safe-bg); color:var(--safe);}
  .tag.warn{background:var(--warn-bg); color:var(--warn);}
  .tag.tool{background:var(--tool-bg); color:var(--tool);}
  .cardactions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}

  .meal-row{display:flex; align-items:center; gap:8px; padding:11px 2px; border-top:1px solid var(--border);}
  .meal-row:first-child{border-top:none;}
  .meal-row .mn{font-size:15px; font-weight:500;}
  .daysel{width:auto; min-width:98px; padding:8px 10px; font-size:14px;}

  .storegroup{margin-bottom:16px;}
  .storehead{display:flex; align-items:center; gap:8px; margin:0 0 8px;}
  .storehead .sh{font-family:var(--display); font-size:16px; font-weight:600;}
  .storehead .count{color:var(--faint); font-size:13px;}
  .gitem{display:flex; align-items:flex-start; gap:11px; padding:10px 12px; background:var(--surface); border:1px solid var(--border); border-radius:11px; margin-bottom:7px; cursor:pointer;}
  .gitem.done{opacity:.5;}
  .gitem.done .gname{text-decoration:line-through;}
  .box{width:22px; height:22px; border-radius:6px; border:2px solid var(--accent-dim); flex:none; margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--bg); font-weight:900;}
  .gitem.done .box{background:var(--accent); border-color:var(--accent);}
  .gname{font-size:15px; font-weight:600;}
  .gmeta{font-size:12.5px; color:var(--muted); margin-top:1px;}

  .toyhead{display:flex; justify-content:space-between; align-items:center; margin:22px 0 8px;}
  .toyhead h2.section{margin:0;}
  .toyhead .tc{font-size:12px; color:var(--faint); font-weight:600; letter-spacing:0; text-transform:none;}

  .overlay{position:fixed; inset:0; background:rgba(8,6,14,.72); z-index:20; display:flex; align-items:flex-end; justify-content:center; padding:0;}
  .sheet{background:var(--surface); border-top-left-radius:20px; border-top-right-radius:20px; width:100%; max-width:760px; max-height:92vh; overflow-y:auto; padding:18px 16px calc(24px + env(safe-area-inset-bottom)); border:1px solid var(--border);}
  @media(min-width:760px){ .overlay{align-items:center;} .sheet{border-radius:20px; max-height:88vh;} }
  .sheet h3{font-family:var(--display); font-size:20px; margin:2px 0 16px;}
  label.fld{display:block; margin-bottom:14px;}
  label.fld .lb, .lb{display:block; font-size:12.5px; color:var(--muted); font-weight:700; letter-spacing:.4px; text-transform:uppercase; margin-bottom:6px;}
  input,select,textarea{width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:12px; font-size:16px; font-family:inherit;}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  textarea{min-height:70px; resize:vertical;}
  select{appearance:none; -webkit-appearance:none;}
  .ingrow{display:grid; grid-template-columns:1fr auto; gap:8px; margin-bottom:8px; align-items:start;}
  .ingrow .g2{display:grid; grid-template-columns:1fr 1fr; gap:8px; grid-column:1 / -1;}
  .ingrow input{padding:10px;}
  .ingrow .del{background:var(--surface2); border:1px solid var(--border); color:var(--danger); border-radius:9px; width:44px; min-height:44px; font-size:18px; cursor:pointer;}
  .tagpick{display:flex; gap:7px; flex-wrap:wrap;}
  .sheetactions{display:flex; gap:10px; margin-top:18px;}
  .sheetactions .btn{flex:1;}

  .optgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:10px;}
  .opt{background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:7px; min-height:auto;}
  .opt.sel{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .opt .sw{width:100%; height:46px; border-radius:8px; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); overflow:hidden; background-repeat:repeat; background-position:center;}
  .opt .dot{width:20px; height:20px; border-radius:50%; box-shadow:0 0 0 3px rgba(0,0,0,.25);}
  .opt .optname{font-size:12px; color:var(--text); font-weight:600; text-align:center; line-height:1.2;}
  .opt .fsamp{font-size:26px; color:var(--accent);}

  .empty-block{text-align:center; padding:40px 20px; color:var(--muted);}
  .empty-block .big{font-family:var(--display); font-size:19px; color:var(--text); margin-bottom:6px;}
  .fab-note{font-size:12px; color:var(--faint); text-align:center; margin-top:18px; line-height:1.5;}
  a{color:var(--accent);}

  #toast{position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px); background:var(--accent); color:#160f1f; font-weight:700; padding:11px 18px; border-radius:12px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50; font-size:14px; box-shadow:0 8px 24px rgba(0,0,0,.4);}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  @media(prefers-reduced-motion:reduce){ #toast{transition:opacity .2s;} #toast.show{transform:translateX(-50%);} }
</style>
</head>
<body>
<div id="bglayer"></div>
<div class="app">
  <header>
    <h1 class="title">The Midnight <span class="moon">Pantry</span></h1>
    <p class="sub">Meals that agree with your family — sorted, tagged &amp; shopped</p>
    <button class="settingsbtn" id="settingsBtn">✦ Themes</button>
  </header>
  <nav id="nav">
    <button data-tab="recipes" class="active">Recipes</button>
    <button data-tab="favorites">Favorites</button>
    <button data-tab="surprise">Surprise</button>
    <button data-tab="kitchen">Kitchen</button>
    <button data-tab="week">This Week</button>
    <button data-tab="shop">Shopping</button>
  </nav>
  <main id="main"></main>
</div>

  {importId:"pin-703756189085678", name:"Dill Pickle Bacon Pasta Salad", protein:"Pork", meal:"Dinner", tags:["adapt"], appliances:[], favorite:false, ingredients:[{name:"Mayonnaise (Adds creaminess to the salad)",qty:"1 cup",store:"",brand:""},{name:"Sour Cream (Offers tangy flavor)",qty:"1/2 cup",store:"",brand:""},{name:"Pickle Brine (Infuses dressing with tanginess)",qty:"1/4 cup",store:"",brand:""},{name:"Yellow Mustard (Enhances flavor)",qty:"1 tablespoon",store:"",brand:""},{name:"Kosher Salt (Elevates taste)",qty:"1 teaspoon",store:"",brand:""},{name:"Sugar (Balances tanginess)",qty:"1 teaspoon",store:"",brand:""},{name:"Bacon (Provides smoky, crispy texture)",qty:"8 slices",store:"",brand:""},{name:"Short Pasta (Acts as the main ingredient)",qty:"8 ounces",store:"",brand:""},{name:"Pickles (Adds refreshing crunch)",qty:"1 cup",store:"",brand:""},{name:"Mini Cucumbers (Contributes fresh bite)",qty:"1 cup",store:"",brand:""},{name:"Mild Cheese (Offers creamy texture)",qty:"1 cup",store:"",brand:""},{name:"Red Onions (Brings color and bite)",qty:"1/2 cup",store:"",brand:""},{name:"Fresh Dill (Adds freshness)",qty:"1/4 cup",store:"",brand:""},{name:"to taste Salt and Pepper (For adjusting seasoning)",qty:"",store:"",brand:""}], pinterest:"https://www.recipesbylily.com/dill-pickle-bacon-pasta-salad/", photoUrl:"https://i.pinimg.com/originals/43/a3/72/43a372e832bac7e4e35569962ecf7e8c.jpg", notes:"1. Fill a large pot with water, bring it to a rolling boil over high heat. 2. Place the bacon pieces in a cold skillet and heat over medium-high heat until crispy. 3. Cook the short pasta in boiling salted water according to package instructions; aim for al dente. 4. In a bowl, combine mayonnaise, sour cream, pickle brine, yellow mustard, kosher salt, and sugar, whisking until smooth. 5. Once pasta is cooled, mix in pickles, cucumbers, cheese, onions, and bacon bits, then add remaining dressing and toss. 6. Serve immediately or chill in the fridge before serving."},

  {importId:"pin-703756189181264", name:"Cilantro Lime Salmon w/ avocado salsa 🤌🏽👩🏽‍🍳🔥", protein:"Seafood (his)", meal:"Dinner", tags:["adapt"], appliances:[], favorite:false, ingredients:[], pinterest:"https://www.pinterest.com/pin/703756189181264/", photoUrl:"https://i.pinimg.com/originals/3f/f3/31/3ff331591d0b93f8144442fe1ec069e4.jpg", notes:"Cilantro Lime Salmon w/ avocado salsa 🤌🏽👩🏽‍🍳🔥 #avocado #salmon #cilantro #salsa #salsaromantica #healthy #healthyrecipes #recipesoftiktok #healthycooking #healthylifestyle #healthyliving #healthymeals #food #dinnerideas #fyp #fypシ"},
  {importId:"pin-703756188322664", name:"Oreo Cheesecake Bites Recipe (+Video)", protein:"Meatless", meal:"Baking", bakeType:"Cookies", tags:["adapt"], appliances:[], favorite:false, ingredients:[{name:"Oreo cookies ((Chop 6 of them into small pieces))",qty:"22",store:"",brand:""},{name:"cream cheese (softened)",qty:"16 ounces",store:"",brand:""},{name:"granulated sugar",qty:"1/2 cup",store:"",brand:""},{name:"vanilla extract",qty:"1/2 tsp",store:"",brand:""},{name:"eggs",qty:"2",store:"",brand:""},{name:"sour cream ((or plain Greek yogurt))",qty:"1/2 cup",store:"",brand:""}], pinterest:"http://izzycooking.com/oreo-cheesecake-bites/", photoUrl:"https://i.pinimg.com/originals/b9/25/5f/b9255f3fb774f11ccdf39cebaee5baa8.jpg", notes:"1. Preheat oven to 325°F. (Make sure your oven temperature is accurate, as a higher temp can cause the cheesecake to crack.) 2. Place cupcake paper liners into a muffin tin pan. Add one Oreo cookie into each paper cup. Set aside. 3. Add softened cream cheese and sugar to a medium mixing bowl. Beat on medium speed using a hand mixer. 4. Then add vanilla and eggs. Mixing well until smooth without lumps. 5. Add sour cream, mix until combined. Tap bowl against your countertop a few times to release any large air bubbles. 6. Stir in chopped cookies, and mix generally using a spatula. (Be careful not to crush oreos into smaller crumbs.) 7. Spoon the batter on top of the oreo, filling each to almost the top. Note that cheesecake won't rise as much as a regular cupcake. 8. Place in the lower third of the oven and bake for about 20-25 minutes until the edges just start to turn brown. Note that classic cheesecake is supposed to look pale, so you're not looking for golden brown. 9. Remove from oven and transfer to cooling racks.  10. Chill in the fridge for 4 hours or overnight. Serve and enjoy! (You can store them in the fridge for up to 5 days.)"},

  {importId:"pin-703756189243608", name:"Instant Pot Broccoli Cheddar Soup", protein:"Other", meal:"Dinner", tags:[], appliances:["Instant Pot"], favorite:false, ingredients:[{name:"broccoli (chopped very small)",qty:"4 cups",store:"",brand:""},{name:"carrots (shredded or chopped very small)",qty:"1 ½ cups",store:"",brand:""},{name:"onion (diced)",qty:"1",store:"",brand:""},{name:"broth ((3 for a thicker soup))",qty:"4 cups",store:"",brand:""},{name:"butter (unsalted)",qty:"4 Tbsp",store:"",brand:""},{name:"garlic cloves (minced)",qty:"2-3",store:"",brand:""},{name:"sea salt",qty:"½ tsp",store:"",brand:""},{name:"cracked pepper",qty:"½ tsp",store:"",brand:""},{name:"paprika",qty:"½ tsp",store:"",brand:""},{name:"half and half",qty:"2 cups",store:"",brand:""},{name:"shredded cheddar cheese",qty:"2 ½ cups",store:"",brand:""},{name:"corn starch",qty:"¼ cups",store:"",brand:""},{name:"water",qty:"¼ cups",store:"",brand:""}], pinterest:"https://lemonsandzest.com/instant-pot-broccoli-cheddar-soup/", photoUrl:"https://i.pinimg.com/originals/75/45/68/754568058c299656f0ff43804515ccde.jpg", notes:"1. Chop all of the veggies and add them to the inner pot of your pressure cooker. Add in the broth, butter, garlic, paprika, salt and pepper. Stir to combine. 2. Seal and close your Instant Pot and turn the vent to \"sealing.\" Set the pressure cooker to pressure cook on high (\"manual\" on Instant Pot brand) for 1 minute. Allow pressure to come up and cycle to completely finish. Do a quick release to let out the pressure. 3. Stir in the cream and shredded cheese and stir to melt the cheese. Whisk the corn starch and water together well until smooth and lump free. Very slowly start to stir in the slurry and stir until fully incorporated. Shift the Instant Pot to “sauté” setting.  Heat and stir until the soup thickens. 4. Adjust seasoning and serve immediately with your choice of garnishes!"},
  {importId:"pin-703756186827887", name:"Six Easy Air Fryer Side Dishes", protein:"Other", meal:"Dinner", tags:[], appliances:["Air Fryer"], favorite:false, ingredients:[{name:"baby potatoes (yellow or red potatoes)",qty:"1 ½ lbs",store:"",brand:""},{name:"grated parmesan cheese (optional but tastes great!)",qty:"¼ cup",store:"",brand:""},{name:"olive oil",qty:"3 Tbsp",store:"",brand:""},{name:"garlic powder",qty:"½ tsp",store:"",brand:""},{name:"onion powder",qty:"½ tsp",store:"",brand:""},{name:"dried thyme",qty:"½ tsp",store:"",brand:""},{name:"dried parsley",qty:"½ tsp",store:"",brand:""},{name:"salt",qty:"½ tsp",store:"",brand:""},{name:"ground black pepper",qty:"¼ tsp",store:"",brand:""},{name:"carrots (peeled and chopped into similar size pieces)",qty:"1 lb",store:"",brand:""},{name:"olive oil",qty:"2 Tbsp",store:"",brand:""},{name:"grated parmesan cheese (optional but delicious)",qty:"2 Tbsp",store:"",brand:""},{name:"garlic powder",qty:"½ tsp",store:"",brand:""},{name:"salt",qty:"½ tsp",store:"",brand:""},{name:"ground black pepper",qty:"¼ tsp",store:"",brand:""},{name:"small broccoli florets (fresh or frozen broccoli will work)",qty:"12 oz",store:"",brand:""},{name:"olive oil (or vegetable oil)",qty:"3 Tbsp",store:"",brand:""},{name:"grated parmesan cheese (optional but adds flavor and crispy bits!)",qty:"2 Tbsp",store:"",brand:""},{name:"garlic powder",qty:"½ Tbsp",store:"",brand:""},{name:"salt",qty:"½ tsp",store:"",brand:""},{name:"ground black pepper",qty:"¼ tsp",store:"",brand:""},{name:"freshly squeezed lemon (drizzled over cooked broccoli)",qty:"½",store:"",brand:""},{name:"medium russet potatoes (washed and dried with a towel)",qty:"4",store:"",brand:""},{name:"olive oil (or vegetable oil)",qty:"1 Tbsp",store:"",brand:""},{name:"salt",qty:"1 tsp",store:"",brand:""},{name:"ground black pepper",qty:"1 tsp",store:"",brand:""},{name:"brussels sprouts – washed (stems removed and sliced in half.)",qty:"1 lb",store:"",brand:""},{name:"olive oil – or vegetable oil",qty:"3 Tbsp",store:"",brand:""},{name:"garlic powder",qty:"1 tsp",store:"",brand:""},{name:"onion powder",qty:"½ tsp",store:"",brand:""},{name:"ground black pepper – to taste",qty:"½ tsp",store:"",brand:""},{name:"salt",qty:"¼ tsp",store:"",brand:""},{name:"grated parmesan cheese",qty:"3 Tbsp",store:"",brand:""},{name:"cauliflower florets",qty:"32 oz",store:"",brand:""},{name:"olive oil",qty:"2 Tbsp",store:"",brand:""},{name:"garlic powder",qty:"½ tsp",store:"",brand:""},{name:"onion powder",qty:"½ tsp",store:"",brand:""},{name:"paprika",qty:"½ tsp",store:"",brand:""},{name:"salt",qty:"½ tsp",store:"",brand:""},{name:"ground black pepper",qty:"¼ tsp",store:"",brand:""},{name:"green beans",qty:"1 lb",store:"",brand:""},{name:"olive oil (or vegetable oil)",qty:"3 Tbsp",store:"",brand:""},{name:"grated parmesan cheese (this is optional)",qty:"2 Tbsp",store:"",brand:""},{name:"garlic powder",qty:"½ tsp",store:"",brand:""},{name:"onion powder",qty:"½ tsp",store:"",brand:""},{name:"ground black pepper",qty:"½ tsp",store:"",brand:""},{name:"salt",qty:"¼ tsp",store:"",brand:""},{name:"medium zucchini (cut into ¼ inch slices (about 3–3½ cups))",qty:"2",store:"",brand:""},{name:"olive oil",qty:"2 Tbsp",store:"",brand:""},{name:"chili powder",qty:"1 tsp",store:"",brand:""},{name:"garlic powder",qty:"½ tsp",store:"",brand:""},{name:"salt",qty:"½ tsp",store:"",brand:""},{name:"ground black pepper",qty:"½ tsp",store:"",brand:""},{name:"grated parmesan cheese",qty:"¼ cup",store:"",brand:""}], pinterest:"https://andianne.com/air-fryer-side-dishes/", photoUrl:"https://i.pinimg.com/originals/71/55/51/7155512fb10f71a1f6758c3e0806c635.jpg", notes:"1. Wash and slice the 1 ½ lbs baby potatoes in half. No need to peel. Add them to a large bowl. 2. Add the ¼ cup grated parmesan, 3 Tbsp olive oil, ½ tsp garlic powder, ½ tsp onion powder, ½ tsp dried thyme, ½ tsp dried parsley, ½ tsp salt, ¼ tsp ground black pepper. 3. Toss the potatoes evenly with all the seasonings. 4. Preheat the air fryer at 400°F for 2 minutes. 5. Add the potatoes in a single layer. Cook for 15-18 minutes, giving them a toss halfway through. 6. Cook until the edges are brown and crispy and potatoes are tender when poked with a fork. 7. Preheat the air fryer at 390°F for 2 minutes. 8. Wash, peel and chop the carrots into a similar size. Add them to a large bowl. 9. Add the 2 Tbsp olive oil, 2 Tbsp grated parmesan cheese, ½ tsp garlic powder, ½ tsp salt, ¼ tsp ground black pepper. Toss the carrots together evenly with the seasonings. 10. Add to the preheated air fryer and bake for 16-18 mins at 390°F, tossing halfway through. 11. Done carrots will be tender when poked with a fork, with charred crispy on the outside edges. 12. Prep the broccoli: Cut into same-size florets, wash, and dry with a towel. If you’re using frozen broccoli, it needs to be thawed before tossing it with the spices. 13. Add 12 oz of broccoli florets to a large bowl along with 3 Tbsp olive oil, 2 Tbsp grated parmesan cheese, ½ Tbsp garlic powder, ½ tsp salt, and ¼ tsp black pepper. Toss the broccoli with the seasonings until it’s evenly coated. 14. Preheat the air fryer to 320°F for 2 minutes. Once heated, add in the broccoli and place in a single layer. Cook for 8 minutes. Poke the broccoli with a fork, it should be crisp-tender. If it isn’t, cook another 1-2 minutes or until it can be poked with a fork but is still firm. 15. Increase the temperature to 400°F. Toss the broccoli in the air fryer basket. Bake for another 2-4 minutes, or until broccoli reaches your desired crispy edges. (Keep an eye on it during this step as it can start to burn easily!) 16. Add the broccoli to a serving plate and drizzle with fresh lemon juice. Serve immediately. 17. Preheat the air fryer 375°F for 5 mins. 18. Prick each baked potato with a fork multiple times on the outside. Drizzle the outside with olive oil, over top and generously season each one with salt and pepper. 19. Place the potatoes in single layer in the air basket. Bake at 375°F for 35 minutes, flipping them halfway through using tongs. The potatoes are done when they are tender when poked with a fork. 20. Transfer the potatoes to a plate using tongs or an oven mitt. Let them cool enough to handle. Slice open the center with a knife and fluff with a fork. Add your favorite toppings and serve. 21. Wash and slice the brussels sprouts in half. Pat them dry with a towel. 22. Add the brussels sprouts to a large bowl along with 3 Tbsp olive oil, 1 tsp garlic powder, 1 tsp onion powder, ¼ tsp salt, ½ tsp ground black pepper, and 2 Tbsp grated parmesan cheese. Toss the ingredients together until evenly mixed. 23. Preheat the air fryer at 325°F for 2 minutes. Add the brussels sprouts and cook for 7-10 minutes, or until tender when poked with a fork. Then raise the temperature to 350°F and cook an additional 2-4 minutes, until you get those crispy outsides. 24. Remove the cauliflower stem and chop it into small bite-size pieces. Wash the cauliflower and pat dry with a towel. Add cauliflower pieces to a large bowl. 25. Add in the 2 Tbsp olive oil, ½ tsp garlic powder, ½ tsp onion powder, ½ tsp paprika, ½ tsp salt, and ¼ tsp ground black pepper to the bowl. Toss everything together until it’s evenly coated. 26. Preheat the air fryer to 380°F for 2 mins. Place the cauliflower in the air fryer in a single layer. Cook for 7-10 minutes, flipping the cauliflower halfway. Check that it’s done by poking with a fork. 27. Wash the green beans and trim off the ends if needed. 28. Add the green beans to a large bowl. Drizzle the 3 Tbsp olive oil over top. Add the 2 Tbsp freshly grated parmesan cheese (if using, it’s optional). Sprinkle the ½ tsp garlic powder, ½ tsp onion powder, ½ tsp ground black pepper and ¼ tsp salt. 29. Toss the green beans together with all the seasonings so that they are evenly coated. 30. Preheat the air fryer at 350°F for 2 minutes. 31. Add in the green beans. Use a spatula to scrape along the side of the bowl to get all the oil, parmesan and spices as well. Spread the green beans into an even layer. 32. Cook for 14 minutes, tossing and shaking the basket with green beans halfway through the process. The edges will start to turn golden brown and the parmesan cheese will crispen up during the process. 33. Slice the zucchini into sticks or bite-size pieces. No need to peel them. Add it to a large bowl. 34. Add in 2 Tbsp olive oil, ¼ cup grated parmesan cheese (optional), 1 tsp chili powder, ½ tsp garlic powder, ½ tsp salt, and ½ tsp ground black pepper. Toss everything together until it’s evenly coated. 35. Preheat the air fryer to 375°F for 2 minutes. Add the zucchini in a single layer. Cook for 6-8 minutes, until tender when poked with a fork."},
  {importId:"pin-703756186148637", name:"10 Minute Air Fryer Chicken Sausage and Veggies - Beginner recipe", protein:"Chicken", meal:"Dinner", tags:[], appliances:["Air Fryer"], favorite:false, ingredients:[{name:"large red bell pepper – cut into 1-inch pieces",qty:"1",store:"",brand:""},{name:"large orange bell pepper – cut into 1-inch pieces",qty:"1",store:"",brand:""},{name:"red onion – peeled and cut into 1-inch pieces",qty:"1",store:"",brand:""},{name:"medium zucchini – cut into 1-inch pieces",qty:"1",store:"",brand:""},{name:"avocado oil",qty:"1 tablespoon",store:"",brand:""},{name:"garlic powder",qty:"1 teaspoon",store:"",brand:""},{name:"onion powder",qty:"1 teaspoon",store:"",brand:""},{name:"Italian seasoning",qty:"1 teaspoon",store:"",brand:""},{name:"kosher salt",qty:"1/2 teaspoon",store:"",brand:""},{name:"pinch of black pepper",qty:"",store:"",brand:""},{name:"chicken sausage (12 oz) – I used a robust Italian flavor",qty:"1 package",store:"",brand:""}], pinterest:"https://pinchmegood.com/10-minute-air-fryer-chicken-sausage-and-veggies/", photoUrl:"https://i.pinimg.com/originals/79/7b/4d/797b4d7bf3d12b0f19b133c336dd695c.jpg", notes:"1. Chop the veggies and add them to a large bowl.  Drizzle them with olive oil and toss to coat them all.  In a smaller bowl, mix the spices together with the salt and pepper and add the spice blend to the veggies.  Toss them in the spices to get them all nice and coated. 2. Slice the sausage into 3/4 inch rounds and add it to the bowl with the veggies and toss everything together. 3. Preheat the air fryer, if needed to 390 degrees F and spray the air fryer basket with cooking spray.  Add the veggies and sausage to the air fryer basket in an even layer and close and cook them for 10 minutes, flipping them in the basket halfway through the cooking time.  You may need to do this in batches depending on the size of your air fryer. 4. Once the chicken sausage and veggies are done cooking, remove them from the air fryer and serve as is or with cooked cauliflower rice or brown rice."},
  {importId:"pin-703756186087512", name:"Muffins and Cupcakes in Air Fryer", protein:"Other", meal:"Baking", bakeType:"Cakes & Cupcakes", tags:[], appliances:["Air Fryer"], favorite:false, ingredients:[], pinterest:"https://www.pinterest.com/pin/703756186087512/", photoUrl:"https://i.pinimg.com/originals/08/8e/31/088e31beb96a844167041374292bc6e6.jpg", notes:""},
  {importId:"pin-703756186780868", name:"Loaded Slow-Cooker Potatoes Save You Valuable Oven Space", protein:"Pork", meal:"Dinner", tags:[], appliances:[], favorite:false, ingredients:[{name:"Cooking spray",qty:"",store:"",brand:""},{name:"lb. baby potatoes, halved and quartered if large",qty:"2",store:"",brand:""},{name:"c. shredded Cheddar",qty:"3",store:"",brand:""},{name:"garlic, thinly sliced",qty:"2 cloves",store:"",brand:""},{name:"bacon, cooked",qty:"8 slices",store:"",brand:""},{name:"c. sliced green onions, plus more for garnish",qty:"1/4",store:"",brand:""},{name:"tbsp. paprika",qty:"1",store:"",brand:""},{name:"Kosher salt",qty:"",store:"",brand:""},{name:"Freshly ground black pepper",qty:"",store:"",brand:""},{name:"Sour cream, drizzling",qty:"",store:"",brand:""}], pinterest:"https://www.delish.com/cooking/recipe-ideas/recipes/a50007/slow-cooker-loaded-potatoes/", photoUrl:"https://i.pinimg.com/originals/00/45/96/0045961667e38556bcd2d846f0ac2a44.png", notes:"1. Line a slow cooker with foil and spray with cooking spray. Add half the potatoes, 1 1/4 cups cheese, half the garlic, 1/3 of the cooked bacon, half the green onions, and half the paprika. Season with salt and pepper. Repeat. 2. Cover and cook on high until potatoes are tender, 5 to 6 hours. (The bigger your potatoes, the longer they'll need.) About 20 to 30 minutes before serving, top with remaining cheese and bacon (this is your moment to make the potatoes look pretty!). 3. Garnish with more green onions and drizzle with sour cream before serving."},

  {importId:"pin-703756188510814", name:"Crockpot Million Dollar Chicken (So Creamy & Easy!)", protein:"Chicken", meal:"Dinner", tags:[], appliances:["Crockpot"], favorite:false, ingredients:[{name:"chopped cooked chicken",qty:"4½ cups",store:"",brand:""},{name:"cream cheese, room temperature",qty:"4- oz",store:"",brand:""},{name:"cottage cheese",qty:"1 cup",store:"",brand:""},{name:"sour cream",qty:"½ cup",store:"",brand:""},{name:"(10.5-oz) can Unsalted Cream of Chicken Soup",qty:"1",store:"",brand:""},{name:"garlic powder",qty:"¼ tsp",store:"",brand:""},{name:"dried onion powder",qty:"¼ tsp",store:"",brand:""},{name:"sleeve Ritz crackers, crushed",qty:"1",store:"",brand:""},{name:"butter, melted",qty:"5 Tbsp",store:"",brand:""}], pinterest:"https://becentsational.com/crockpot-million-dollar-chicken/", photoUrl:"https://i.pinimg.com/originals/82/05/06/820506bc6663e98f02fc41eda8f8e9c5.jpg", notes:"1. Place the chopped cooked chicken at the bottom of your slow cooker. 2. In a mixing bowl, combine the cream of chicken soup, cream cheese, cottage cheese, sour cream, garlic powder, and onion powder. Mix well. 3. Pour this creamy mixture over the chicken in the slow cooker, making sure to spread it evenly and combine well. 4. Cover the slow cooker and set it to cook on low for 4-6 hours, until the mixture is hot and bubbly. 5. Once cooked, mix the crushed Ritz crackers with melted butter in a bowl. Sprinkle this topping over the casserole in the slow cooker. 6. Place the lid back on the slow cooker and let it cook on low or warm for an additional 10 minutes, allowing the topping to get warm and slightly crispy. 7. Serve your delicious Crockpot Million Dollar Chicken Casserole hot and enjoy!"},
  {importId:"pin-703756187568477", name:"Instant Pot Chicken Cacciatore Recipe", protein:"Chicken", meal:"Dinner", tags:[], appliances:["Instant Pot"], favorite:true, ingredients:[{name:"jar spaghetti sauce (24 oz.)",qty:"1",store:"",brand:""},{name:"chicken breasts (boneless skinless, cut into bite size pcs.)",qty:"4",store:"",brand:""},{name:"onion (sliced)",qty:"1/2-1",store:"",brand:""},{name:"bell peppers (any variety, sliced)",qty:"3",store:"",brand:""},{name:"chili powder",qty:"1/2 tsp",store:"",brand:""},{name:"garlic salt",qty:"1 tsp",store:"",brand:""},{name:"c water",qty:"1/2",store:"",brand:""},{name:"c mushrooms (quartered, optional)",qty:"1",store:"",brand:""},{name:"red pepper flakes (optional for heat)",qty:"",store:"",brand:""}], pinterest:"https://temeculablogs.com/instant-pot-chicken-cacciatore-recipe/", photoUrl:"https://i.pinimg.com/originals/45/08/80/4508802ce2e1af80b2d9eeb2c78640a3.png", notes:"1. Pour half jar of spaghetti sauce on bottom of pot. Cube chicken into small bite size pieces and add into your Instant Pot. 2. Pour rest of spaghetti sauce over that. Add 1/2 c. water into your spaghetti sauce jar, put on lid and shake to get remaining sauce out of jar. Pour this liquid on top of chicken. 3. Cut bell peppers and onion into strips (thicker if you want them firmer when done, thinner if you want them really soft). Add into your pressure cooker. 4. Sprinkle your chili powder, garlic salt, and any other seasonings you like over that. 5. Set your Instant Pot to manual, pressure, high, for 3 minutes. 6. Allow to naturally release steam for 2 minutes, then quick release, lift lid carefully and serve over rice!(as always, check chicken when done to make sure it is thoroughly cooked thru, 3 min. is plenty of time if cut into bite size pcs. initially)"},
  {importId:"pin-703756186048639", name:"Crispy Homemade Air Fryer Tortilla Chips", protein:"Other", meal:"Dinner", tags:[], appliances:["Air Fryer"], favorite:false, ingredients:[], pinterest:"https://www.pinterest.com/pin/703756186048639/", photoUrl:"https://i.pinimg.com/originals/5c/6f/ce/5c6fce960726ac4edb83675c2b649106.jpg", notes:""},
  {importId:"pin-703756187782215", name:"Crockpot honey garlic chicken 🍯🤤✨ everything you’ll need for this is listed below and full", protein:"Chicken", meal:"Dinner", tags:[], appliances:["Crockpot"], favorite:false, ingredients:[], pinterest:"https://spicethrive.com/category/delicious-recipes/", photoUrl:"https://i.pinimg.com/originals/a8/85/a9/a885a92815282d5202b4c007c3429dab.jpg", notes:""},
  {importId:"pin-703756189479291", name:"Cheesy Slow Cooker Cowboy Potato Casserole For Comfort Food", protein:"Ground Meat", meal:"Dinner", tags:[], appliances:["Crockpot"], favorite:false, ingredients:[{name:"Frozen Hash Browns",qty:"",store:"",brand:""},{name:"Ground Beef",qty:"",store:"",brand:""},{name:"Cheddar Cheese",qty:"",store:"",brand:""},{name:"Cream of Mushroom Soup",qty:"",store:"",brand:""},{name:"Bacon Bits",qty:"",store:"",brand:""},{name:"Onions",qty:"",store:"",brand:""},{name:"Bell Peppers",qty:"",store:"",brand:""}], pinterest:"https://glowplora.com/savory-slow-cooker-cowboy-potato-casserole-recipe-delight/", photoUrl:"https://i.pinimg.com/originals/92/a8/dd/92a8dd857aaffcc49cc0d5d45166dac7.png", notes:"1. Prepare the Slow Cooker: Start by lightly greasing your slow cooker with cooking spray or a bit of olive oil to prevent sticking. 2. Brown the Beef: In a skillet over medium heat, brown the ground beef until fully cooked. Drain any excess fat and set aside. 3. Sauté the Vegetables: In the same skillet, sauté the chopped onions and bell peppers until softened, about 5 minutes. 4. Mix the Base: In a large bowl, combine the cooked beef, sautéed vegetables, frozen hash browns, cream of mushroom soup, and half of the shredded cheese. Mix well until everything is evenly coated. 5. Add to Slow Cooker: Transfer the mixture into the prepared slow cooker, spreading it out evenly. Top with the remaining shredded cheese and sprinkle the bacon bits over the top. 6. Cook: Cover and cook on low for 6-8 hours or on high for 3-4 hours. The casserole is ready when the hash browns are tender and the cheese is bubbly. 7. Serve: Once cooked, give it a gentle stir before serving. Garnish with chopped green onions or fresh parsley for a pop of color and flavor."},
  {importId:"pin-703756187482576", name:"Air Fryer Blooming Onion Recipe", protein:"Other", meal:"Dinner", tags:[], appliances:["Air Fryer"], favorite:false, ingredients:[], pinterest:"https://www.allrecipes.com/air-fryer-blooming-onion-recipe-7546676?utm_campaign=allrecipes_662dadb45a6ea300012b3ac3&utm_content=verticalimage&utm_medium=social&utm_source=pinterest.com", photoUrl:"https://i.pinimg.com/originals/60/be/b3/60beb3ff97679976964540e2a6ff03c0.jpg", notes:"Use your air fryer to prepare this blooming onion, a fun appetizer resembling a flower. Serve with dipping sauce as a shared appetizer."},
  {importId:"pin-703756188636329", name:"AIR FRYER CRISPY PORK BELLY", protein:"Pork", meal:"Dinner", tags:[], appliances:["Air Fryer"], favorite:false, ingredients:[{name:"pork belly (1.5 kg, skin on)",qty:"3 pound",store:"",brand:""},{name:"kosher salt",qty:"1/2 tablespoon",store:"",brand:""},{name:"white pepper (5 g)",qty:"1/2 tablespoon",store:"",brand:""},{name:"five spice powder (5 g)",qty:"1/2 tablespoon",store:"",brand:""},{name:"sugar (6 g)",qty:"1/2 tablespoon",store:"",brand:""},{name:"Shaoxing wine (7 ml)",qty:"1/2 tablespoon",store:"",brand:""},{name:"kosher salt",qty:"1 cup",store:"",brand:""},{name:"white vinegar (15 ml)",qty:"1 tablespoon",store:"",brand:""},{name:"neutral oil (15 ml)",qty:"1 tablespoon",store:"",brand:""}], pinterest:"https://cjeatsrecipes.com/air-fryer-crispy-pork-belly/", photoUrl:"https://i.pinimg.com/originals/1b/90/65/1b9065e0d5ee3ceb5bfd1d6866dfa7aa.jpg", notes:"1. To the meat side, use a knife to make 1/2\" deep cuts lengthwise across the pork belly. In a small bowl, combine salt, white pepper, five spice powder, sugar, and Shaoxing wine to make a paste. Evenly spread the paste on the meat side of the pork and crevices ensuring not to touch the skin. 2. Pat the skin-on pork belly dry with a paper towel and poke holes all across the skin of the pork using skewers or sharp knife. Ensure that the holes only puncture the skin and fat (do not pierce all the way through the meat). Cut the slab of pork belly so it will fit in your air fryer. 3. Create a tin foil frame around the pork belly, leaving a ½” gap up from the edges of the pork to prevent salt from spilling over. Brush a layer of vinegar on the skin, then cover the skin completely with a layer of salt. 4. Air fry at 250F for 30 minutes or until the salt has dried completely. 5. Remove the salt from the pork belly and brush off any excess. Pat dry with a paper towel. 6. Brush the skin with neutral oil, then air fry at 400F for 30-40 minutes until the skin is puffed and crispy. Check at the 20 minute mark and every 5 minutes to monitor the skin, checking for burning, as the time will vary with different air fryers! If spots of the skin begin to burn, place a small piece of foil over the specific area to cover it and allow the exposed areas to continue crisping up."},

  {importId:"pin-703756189385459", name:"French Onion Chicken Orzo Casserole", protein:"Chicken", meal:"Dinner", tags:[], appliances:[], favorite:true, ingredients:[{name:"unsalted butter",qty:"2 tablespoons",store:"",brand:""},{name:"olive oil",qty:"1 tablespoon",store:"",brand:""},{name:"large yellow onions (thinly sliced)",qty:"2",store:"",brand:""},{name:"sugar",qty:"1 teaspoon",store:"",brand:""},{name:"salt",qty:"1/2 teaspoon",store:"",brand:""},{name:"garlic cloves (minced)",qty:"3",store:"",brand:""},{name:"orzo pasta",qty:"1 1/2 cups",store:"",brand:""},{name:"cooked shredded chicken (rotisserie works well)",qty:"2 cups",store:"",brand:""},{name:"dried thyme",qty:"1/2 teaspoon",store:"",brand:""},{name:"black pepper",qty:"1/4 teaspoon",store:"",brand:""},{name:"low-sodium chicken broth",qty:"2 cups",store:"",brand:""},{name:"heavy cream (or half and half for lighter option)",qty:"1 cup",store:"",brand:""},{name:"shredded mozzarella cheese",qty:"1 1/2 cups",store:"",brand:""},{name:"grated Parmesan cheese",qty:"1/2 cup",store:"",brand:""},{name:"Optional: 1/2 teaspoon Worcestershire sauce or balsamic glaze (for added depth)",qty:"",store:"",brand:""}], pinterest:"https://theferventmama.com/french-onion-chicken-orzo-casserole/", photoUrl:"https://i.pinimg.com/originals/d9/8a/d9/d98ad9c0155ac28005fd6c46ada2a61b.png", notes:"1. Caramelize the Onions 2. In a large oven-safe skillet or Dutch oven, melt the butter and olive oil over medium heat. Add sliced onions, sugar, and salt. Cook for 20–25 minutes, stirring occasionally, until the onions are deeply golden and caramelized. Stir in the minced garlic during the last 1–2 minutes. 3. Add Orzo and Chicken 4. Stir in the orzo and cook for 2 minutes, allowing it to lightly toast. Add shredded chicken, thyme, pepper, and Worcestershire if using. Mix well. 5. Pour in Liquids 6. Add the chicken broth and cream. Bring to a gentle simmer. Reduce heat to low, cover, and let it cook for 8–10 minutes, stirring occasionally, until the orzo is tender. 7. Add Cheese 8. Stir in 1 cup mozzarella and the Parmesan cheese. Mix until melted and creamy. 9. Bake the Casserole 10. Preheat oven to 375°F (190°C). Sprinkle the remaining 1/2 cup mozzarella over the top. Bake uncovered for 10–15 minutes until bubbly and golden on top. 11. Serve 12. Let it rest for 5–10 minutes before serving. Garnish with fresh thyme or parsley if desired."},

  {importId:"pin-703756189476497", name:"Crispy Creamy BLT Pasta Salad Recipe Easy 5-Step Summer Side Dish", protein:"Pork", meal:"Dinner", tags:[], appliances:[], favorite:true, ingredients:[{name:"rotini or bowtie pasta",qty:"12 ounces",store:"",brand:""},{name:"thick-cut bacon, cooked until crispy and chopped",qty:"8 slices",store:"",brand:""},{name:"chopped Romaine or iceberg lettuce",qty:"2 cups",store:"",brand:""},{name:"cherry tomatoes, halved",qty:"1 cup",store:"",brand:""},{name:"green onions, thinly sliced",qty:"3",store:"",brand:""},{name:"mayonnaise",qty:"1 cup",store:"",brand:""},{name:"sour cream",qty:"1/2 cup",store:"",brand:""},{name:"apple cider vinegar",qty:"1 tablespoon",store:"",brand:""},{name:"Dijon mustard",qty:"1 teaspoon",store:"",brand:""},{name:"garlic powder",qty:"1/2 teaspoon",store:"",brand:""},{name:"Salt and pepper to taste",qty:"",store:"",brand:""},{name:"Optional: 1/4 cup shredded sharp cheddar cheese",qty:"",store:"",brand:""}], pinterest:"https://flurpchef.com/crispy-creamy-blt-pasta-salad-recipe-easy-5-step-summer-side-dish/", photoUrl:"https://i.pinimg.com/originals/df/00/31/df0031bc5e21ec6d35fb9955bc80a69f.png", notes:"1. Bring a large pot of salted water to a boil. Add 12 ounces of rotini pasta and cook according to package instructions, about 8-10 minutes until al dente. Stir occasionally to prevent sticking. Drain well and set aside, keeping it slightly warm. 2. While pasta cooks, heat a skillet over medium heat. Lay 8 slices of thick-cut bacon flat and cook until crispy, about 5-7 minutes per side. Transfer to paper towels to drain excess fat, then chop into bite-sized pieces. Optionally, save bacon fat to sauté green onions. 3. Rinse and chop 2 cups Romaine lettuce into bite-sized pieces, halve 1 cup cherry tomatoes, and slice 3 green onions thinly. Optionally toss green onions in warm bacon fat for extra flavor. 4. In a medium bowl, whisk together 1 cup mayonnaise, 1/2 cup sour cream, 1 tablespoon apple cider vinegar, 1 teaspoon Dijon mustard, 1/2 teaspoon garlic powder, and salt and pepper to taste. Adjust seasoning as needed. 5. In a large bowl, toss the warm pasta with the dressing to absorb flavors. Add chopped bacon, lettuce, tomatoes, and green onions. If using, sprinkle 1/4 cup shredded sharp cheddar cheese and gently fold in. Chill for at least 30 minutes before serving. Serve cold or at room temperature."},

  {importId:"pin-703756189335257", name:"Garlic Mushroom Pasta", protein:"Chicken", meal:"Dinner", tags:[], appliances:[], favorite:true, ingredients:[{name:"uncooked pasta",qty:"4 ounces",store:"",brand:""},{name:"olive oil",qty:"1 tablespoon",store:"",brand:""},{name:"butter (divided)",qty:"3 tablespoons",store:"",brand:""},{name:"medium onion (chopped)",qty:"1/2",store:"",brand:""},{name:"cremini mushrooms (sliced)",qty:"8 ounces",store:"",brand:""},{name:"garlic (minced)",qty:"3 cloves",store:"",brand:""},{name:"Dijon mustard",qty:"1/2 teaspoon",store:"",brand:""},{name:"chicken broth or veg broth or white wine",qty:"1/4 cup",store:"",brand:""},{name:"lemon juice + zest of 1/2 lemon",qty:"1/2 teaspoon",store:"",brand:""},{name:"freshly grated parmesan cheese",qty:"1/2 cup",store:"",brand:""},{name:"chopped fresh parsley",qty:"2 tablespoons",store:"",brand:""},{name:"Salt & pepper (to taste)",qty:"",store:"",brand:""}], pinterest:"https://www.saltandlavender.com/garlic-mushroom-pasta/", photoUrl:"https://i.pinimg.com/originals/80/33/0e/80330e380e7364af78495ee1e45d372e.jpg", notes:"1. Boil a salted pot of water and cook the pasta al dente according to package directions. 2. Add the oil and 1 tablespoon of the butter to a skillet over medium-high heat. Once the pan is hot, add the onions and mushrooms. Sauté, stirring occasionally, until the water has been released from the mushrooms & cooked off and everything gets a good sear and is browned/caramelized (this gives a ton of flavor). It'll take 8-10 minutes or possibly a bit longer. 3. Stir in the rest of the butter, plus the garlic and Dijon mustard. Cook for about a minute. 4. Add in the broth and lemon juice + zest, and let it bubble for about a minute or so. 5. Take the pan off the heat and stir in the parmesan cheese and parsley. Add a splash of the hot pasta water prior to draining the pasta (a couple tablespoons) and then toss the pasta with the sauce. Season with salt & pepper as needed and serve immediately."},
  {importId:"pin-703756189359174", name:"Creamy Parmesan Garlic Beef Bowtie Pasta - Crisp Tastes", protein:"Ground Meat", meal:"Dinner", tags:[], appliances:[], favorite:true, ingredients:[{name:"ground beef",qty:"1 lb",store:"",brand:""},{name:"olive oil",qty:"3 teaspoons",store:"",brand:""},{name:"garlic, minced",qty:"5-6 cloves",store:"",brand:""},{name:"small onion, finely chopped",qty:"1",store:"",brand:""},{name:"Worcestershire sauce",qty:"1 teaspoon",store:"",brand:""},{name:"Italian seasoning",qty:"1 teaspoon",store:"",brand:""},{name:"smoked paprika",qty:"1/2 teaspoon",store:"",brand:""},{name:"butter",qty:"3 tablespoons",store:"",brand:""},{name:"beef broth",qty:"3 cups",store:"",brand:""},{name:"Bowtie Pasta",qty:"8 oz",store:"",brand:""},{name:"freshly grated Parmesan cheese",qty:"1 cup",store:"",brand:""},{name:"half and half (or whole milk)",qty:"3/4 cup",store:"",brand:""},{name:"salt (adjust to taste)",qty:"1/2 teaspoon",store:"",brand:""},{name:"black pepper",qty:"1/4 teaspoon",store:"",brand:""},{name:"red pepper flakes",qty:"1/2 teaspoon",store:"",brand:""},{name:"fresh parsley, finely chopped",qty:"1-2 tablespoons",store:"",brand:""}], pinterest:"https://crisptastes.com/creamy-parmesan-garlic-beef-bowtie-pasta-recipe/?fbclid=IwZXh0bgNhZW0CMTEAAR6uJInKgxktDdVKIFqfcX21QLIBwlJs72v1XkIHM5Tl4a9qd39n9AkdcyZrSQ_aem_DLKwzfs1GvFgD4E1bI6ltg", photoUrl:"https://i.pinimg.com/originals/d5/f3/d5/d5f3d5e4715d9c24925217b34c770a52.jpg", notes:"1. Heat olive oil in a large skillet over medium-high heat. Add ground beef and cook until browned, breaking it apart as it cooks. Once browned, drain any excess fat if necessary. 2. Add the chopped onion and garlic to the beef. Cook for 2-3 minutes until the onion is soft and translucent, and the garlic is fragrant. 3. Stir in Worcestershire sauce, Italian seasoning, and smoked paprika. Let the mixture cook for another minute to combine the flavors. 4. Add butter to the skillet and allow it to melt, then pour in the beef broth. Bring the mixture to a simmer and let it cook for 3-4 minutes to reduce slightly. 5. Meanwhile, cook the bowtie pasta according to the package instructions in a separate pot, draining once cooked and setting it aside. 6. Once the broth has reduced a bit, stir in the half and half (or whole milk), and add in the freshly grated Parmesan cheese. Stir until the sauce becomes creamy and the cheese has melted. 7. Season the sauce with salt, black pepper, and red pepper flakes. Stir everything together, allowing the flavors to meld together for another 2-3 minutes. 8. Add the cooked bowtie pasta to the skillet and toss to coat the pasta in the creamy sauce. Continue stirring until the pasta is evenly coated and everything is well mixed. 9. Serve the creamy Parmesan garlic beef bowtie pasta hot, garnished with fresh parsley for a pop of color and freshness."},

  {importId:"pin-703756188845093", name:"Sour Cream and Onion Chicken", protein:"Chicken", meal:"Dinner", tags:[], appliances:[], favorite:true, ingredients:[{name:"boneless skinless chicken breasts",qty:"2",store:"",brand:""},{name:"garlic powder",qty:"1/2 teaspoon",store:"",brand:""},{name:"Salt & pepper (to taste)",qty:"",store:"",brand:""},{name:"olive oil",qty:"1 tablespoon",store:"",brand:""},{name:"butter (divided)",qty:"2 tablespoons",store:"",brand:""},{name:"medium onion (sliced)",qty:"1",store:"",brand:""},{name:"garlic (minced)",qty:"1 clove",store:"",brand:""},{name:"chicken broth",qty:"1/2 cup",store:"",brand:""},{name:"Worcestershire sauce",qty:"1 teaspoon",store:"",brand:""},{name:"sour cream (full-fat)",qty:"1 cup",store:"",brand:""},{name:"Fresh chopped parsley (optional, to taste)",qty:"",store:"",brand:""}], pinterest:"https://www.saltandlavender.com/sour-cream-and-onion-chicken/", photoUrl:"https://i.pinimg.com/originals/9f/07/2e/9f072ee77afa1fab5a472de40849c345.jpg", notes:"1. Cut the chicken breasts in half lengthwise so you have 4 thinner pieces. Sprinkle them with the garlic powder and some salt & pepper. 2. To a skillet, add the olive oil and one tablespoon of the butter. Let the pan heat up over medium-high heat for a few minutes. 3. Once the pan is hot, add the chicken. Cook it for about 5-6 minutes/side or until it's golden and cooked through (165F). Transfer the chicken to a plate. 4. Reduce the heat to medium, and add in the remaining butter and the onion. Sauté the onion until it's softened and lightly browned (about 10-15 minutes). Timing will vary depending on how thick you sliced the onion. You may need to turn the heat down further if it seems like it's burning vs. slowly browning. 5. Stir in the garlic and cook for 30 seconds. 6. Stir in the chicken broth and Worcestershire sauce, and scrape up any brown bits from the bottom of the pan. 7. Stir in the sour cream until you've got a smooth sauce, and let it heat through for a couple of minutes (ensure it doesn't bubble too much or else it could curdle). 8. Add the chicken back to the skillet and spoon some sauce over top. Season with extra salt & pepper if needed, and serve immediately with some chopped parsley sprinkled over top."},

  {importId:"pin-703756189062506", name:"Chicken Feta Spinach Pasta", protein:"Chicken", meal:"Dinner", tags:[], appliances:[], favorite:true, ingredients:[{name:"uncooked pasta",qty:"8 ounces",store:"",brand:""},{name:"chicken breasts (cut into bite-size pieces)",qty:"2",store:"",brand:""},{name:"olive oil",qty:"1 tablespoon",store:"",brand:""},{name:"dried oregano",qty:"1/4 teaspoon",store:"",brand:""},{name:"garlic powder",qty:"1/4 teaspoon",store:"",brand:""},{name:"chicken broth",qty:"1/3 cup",store:"",brand:""},{name:"Dijon mustard",qty:"1/2 teaspoon",store:"",brand:""},{name:"lemon juice",qty:"1 teaspoon",store:"",brand:""},{name:"(10.5 ounce) container little tomatoes (grape, cherry, etc.) (cut into halves)",qty:"1",store:"",brand:""},{name:"(packed) fresh baby spinach",qty:"1.5 cups",store:"",brand:""},{name:"feta (I used a kind that's cubed and packed in oil and herbs)",qty:"3.5 ounces",store:"",brand:""},{name:"Red pepper flakes (to taste (optional))",qty:"",store:"",brand:""},{name:"Freshly grated parmesan cheese (to taste (optional))",qty:"",store:"",brand:""}], pinterest:"https://www.saltandlavender.com/chicken-feta-spinach-pasta/", photoUrl:"https://i.pinimg.com/originals/f6/c4/72/f6c4724b9e3a07a0276da6d58ee814a4.jpg", notes:"1. Boil a large, salted pot of water for the pasta and cook it al dente according to package directions. 2. Prep your chicken. Add it to a skillet, along with the olive oil, dried oregano, and garlic powder. Cook over medium-high heat for 5-7 minutes, stirring often. Chicken should be close to cooked. Take chicken out of pan and set aside. 3. Add the chicken broth, Dijon mustard, and lemon juice to the pan. Stir until the mustard has dissolved. Let it simmer for about a minute. 4. Add the tomatoes and cook for 4-5 minutes, stirring occasionally. They should be falling apart and making a nice tomato sauce. 5. Add the chicken back into the pan. Let it heat through (and make sure it's fully cooked without overcooking it). 6. Stir in const photos={};
function compressImage(file){ return new Promise((resolve,reject)=>{ const img=new Image(); const url=URL.createObjectURL(file); img.onload=()=>{ let w=img.width,h=img.height,M=760; if(w>h&&w>M){ h=Math.round(h*M/w); w=M; } else if(h>=w&&h>M){ w=Math.round(w*M/h); h=M; } const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h); URL.revokeObjectURL(url); try{ resolve(c.toDataURL("image/jpeg",0.72)); }catch(e){ reject(e); } }; img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("bad image")); }; img.src=url; }); }
async function loadPhoto(pid){ try{ const r=await window.storage.get("mpimg:"+pid); if(r&&r.value) photos[pid]=r.value; }catch(e){} }
async function savePhoto(pid,d){ photos[pid]=d; try{ if(window.storage) await window.storage.set("mpimg:"+pid,d); }catch(e){} }

/* render */

function recipeCard(r){ const ings=r.ingredients.filter(i=>i.name).map(i=>esc(i.name)).slice(0,6).join(" · "); const shown=r.ingredients.filter(i=>i.name).length;
  return `<div class="card">${(photos[r.id]||r.photoUrl)?`<img src="${photos[r.id]||r.photoUrl}" alt="" onerror="this.style.display='none'" style="width:100%;height:160px;object-fit:cover;border-radius:10px;margin-bottom:11px;display:block;">`:""}<div class="cardhead"><p class="name" style="flex:1;">${esc(r.name)}</p><button class="starbtn ${r.favorite?'on':''}" data-act="fav" data-id="${r.id}" aria-label="Make again">${r.favorite?'★':'☆'}</button></div>${shown?`<div class="muted" style="font-size:13.5px;">${ings}${shown>6?" …":""}</div>`:""}${chipsFor(r)}<div class="cardactions"><button class="ghost tiny" data-act="addweek" data-id="${r.id}">＋ This week</button><button class="ghost tiny" data-act="edit" data-id="${r.id}">Edit</button>${r.pinterest?`<a class="ghost tiny" style="text-decoration:none; display:inline-flex; align-items:center;" href="${esc(r.pinterest)}" target="_blank" rel="noopener">Pin ↗</a>`:""}</div></div>`; }
function groupBy(list,cats,keyOf){ let body=""; cats.forEach(c=>{ const g=list.filter(r=>(keyOf(r)||"Other")===c); if(!g.length) return; body+=`<h2 class="section">${esc(c)}</h2>`+g.map(recipeCard).join(""); }); return body; }
function groupByProtein(list){ return groupBy(list,PROTEINS,r=>r.protein); }
function renderRecipes(){
  const mv=state.mealView||"Dinner";
  const seg=MEALS.map(m=>`<button class="chip ${mv===m?'on':''}" data-act="mealview" data-id="${m}">${esc(m)}</button>`).join("");
  const active=state.filters;
  const adaptChip=TAGS.map(t=>`<button class="chip ${t.type} ${active.includes(t.id)?'on':''}" data-act="filter" data-id="${t.id}">${esc(t.label)}</button>`).join("");
  const inMeal=state.recipes.filter(r=>(r.meal||"Dinner")===mv);
  const filtered=inMeal.filter(r=>active.every(f=>(r.tags||[]).includes(f)));
  let body;
  if(!inMeal.length) body=emptyBlock("Nothing here yet",`Tap “Add a ${mv.toLowerCase()} recipe” to start this section.`);
  else if(!filtered.length) body=emptyBlock("Nothing matches that filter","Tap the Adapt me chip again to clear it.");
  else body=(mv==="Baking")?groupBy(filtered,BAKETYPES,r=>r.bakeType):groupByProtein(filtered);
  main.innerHTML=`<div class="filterbar" style="margin-bottom:10px;">${seg}</div>
    <div class="filterbar">${adaptChip}</div>
    <button class="btn" style="width:100%; margin:6px 0;" data-act="add">＋ Add a ${mv.toLowerCase()} recipe</button>
    ${body}
    <p class="fab-note">Sections up top switch between Breakfast, Lunch, Dinner &amp; Baking. Tap ☆ to save a keeper · “＋ This week” to plan it.</p>`;
}
function renderFavorites(){ const favs=state.recipes.filter(r=>r.favorite); const body=favs.length?groupByProtein(favs):emptyBlock("No keepers yet","Tap the ☆ on any recipe you've made and loved — it'll live here so it's easy to make again."); main.innerHTML=`<h2 class="section">Made it &amp; would make again</h2><div class="muted" style="font-size:13.5px; margin:-4px 0 14px;">Your tried-and-true keepers. Tap a star to remove one.</div>${body}`; }
function renderKitchen(){ let body=""; if(!state.appliances.length){ body=emptyBlock("No kitchen toys yet","Add your crockpot, Instant Pot, air fryer — whatever you cook with — above."); } else { state.appliances.forEach(toy=>{ const recs=state.recipes.filter(r=>(r.appliances||[]).includes(toy)); body+=`<div class="toyhead"><h2 class="section">${esc(toy)} <span class="tc">${recs.length} recipe${recs.length===1?'':'s'}</span></h2><button class="iconbtn" data-act="removetoy" data-toy="${esc(toy)}" aria-label="Remove ${esc(toy)}">✕</button></div>`; body+=recs.length?recs.map(recipeCard).join(""):`<div class="muted" style="font-size:13.5px; padding:0 2px 8px; font-style:italic;">Nothing tagged for this yet — open a recipe's Edit screen to add it.</div>`; }); }

function renderWeek(){ const meals=state.weekMeals; if(!meals.length){ main.innerHTML=emptyBlock("No meals picked yet","Head to Recipes and tap “＋ This week” on anything you'd like to cook."); return; } const orderOf=d=>{ const i=DAYS.indexOf(d); return i===-1?99:i; }; const sorted=[...meals].sort((a,b)=>orderOf(a.day)-orderOf(b.day));
  const rows=sorted.map(m=>{ const r=recipeById(m.recipeId); if(!r) return ""; const opts=[`<option value="">Any day</option>`,...DAYS.map(d=>`<option value="${d}" ${m.day===d?"selected":""}>${d}</option>`)].join(""); return `<div class="meal-row"><div class="mn" style="flex:1;">${esc(r.name)}${r.protein==="Seafood (his)"?' <span class="tag warn" style="margin-left:5px;">his</span>':''}</div><select class="daysel" data-act="setday" data-eid="${m.eid}">${opts}</select><button class="iconbtn" data-act="removemeal" data-eid="${m.eid}" aria-label="remove">✕</button></div>`; }).join("");
  main.innerHTML=`<h2 class="section">Meals this week</h2><div class="muted" style="font-size:13.5px; margin:-4px 0 12px;">${meals.length} meal${meals.length>1?"s":""} planned · a day is optional</div><div class="card" style="padding:4px 12px;">${rows}</div><button class="ghost" style="width:100%; margin-top:12px;" data-act="clearweek">Clear this week</button><p class="fab-note">Everything here flows into your Shopping list, grouped by store.</p>`; }
function buildList(){ const map=new Map(); state.weekMeals.forEach(m=>{ const r=recipeById(m.recipeId); if(!r) return; r.ingredients.forEach(i=>{ if(!i.name) return; const store=i.store||"Unassigned"; const k=store+"||"+i.name.toLowerCase()+"||"+(i.brand||"").toLowerCase(); if(!map.has(k)) map.set(k,{key:k,name:i.name,brand:i.brand,store,qtys:[]}); if(i.qty) map.get(k).qtys.push(i.qty); }); }); state.manual.forEach(m=>{ map.set("M::"+m.id,{key:"M::"+m.id,name:m.name,brand:"",store:m.store||"Unassigned",qtys:[],manual:true}); }); return map; }
function renderShop(){ const map=buildList(); const order=[...STORES,"Unassigned"]; let body="",total=0,done=0; order.forEach(store=>{ const items=[...map.values()].filter(i=>i.store===store); if(!items.length) return; total+=items.length; const rows=items.map(i=>{ const d=!!state.checked[i.key]; if(d) done++; const meta=[i.qtys.join(", "),i.brand].filter(Boolean).join(" · "); return `<div class="gitem ${d?'done':''}" data-act="check" data-key="${esc(i.key)}"><div class="box">${d?'✓':''}</div><div style="flex:1;"><div class="gname">${esc(i.name)}</div>${meta?`<div class="gmeta">${esc(meta)}</div>`:""}</div>${i.manual?`<button class="iconbtn" data-act="delmanual" data-key="${esc(i.key)}" aria-label="remove">✕</button>`:""}</div>`; }).join(""); body+=`<div class="storegroup"><div class="storehead"><span class="sh">${esc(store)}</span><span class="count">${items.length}</span></div>${rows}</div>`; });
  main.innerHTML=`${total?`<div class="muted" style="font-size:13.5px; margin-bottom:12px;">${done} of ${total} gathered${done?` · <button class="link" data-act="clearchecked" style="padding:0;">reset checks</button>`:""}</div>`:""}${total?body:emptyBlock("Nothing to shop for yet","Add meals under This Week and your list builds itself, split by store.")}<div class="card" style="margin-top:6px;"><div class="lb">Add an item by hand</div><div class="ingrow"><input id="mItem" placeholder="e.g. paper towels" /><button class="ghost" data-act="addmanual" style="min-height:44px;">Add</button></div><select id="mStore">${STORES.map(s=>`<option>${s}</option>`).join("")}</select></div>`; }
function emptyBlock(big,sub){ return `<div class="empty-block"><div class="big serif">${esc(big)}</div><div>${esc(sub)}</div></div>`; }

/* settings */
function openSettings(){
  const overlay=document.createElement("div"); overlay.className="overlay"; const sheet=document.createElement("div"); sheet.className="sheet"; overlay.appendChild(sheet);
  const fontOpts=FONTS.map(f=>`<button class="opt ${state.font===f.id?'sel':''}" data-kind="font" data-id="${f.id}"><span class="sw"><span class="fsamp" style="font-family:${f.stack};">Aa</span></span><span class="optname">${esc(f.name)}</span></button>`).join("");
  const themeOpts=THEMES.map(th=>`<button class="opt ${state.theme===th.id?'sel':''}" data-kind="theme" data-id="${th.id}"><span class="sw" style="background:${th.vars.bg}"><span class="dot" style="background:${th.vars.accent}"></span></span><span class="optname">${esc(th.name)}</span></button>`).join("");
  const bgOpts=BGS.map(b=>`<button class="opt ${state.bg===b.id?'sel':''}" data-kind="bg" data-id="${b.id}"><span class="sw" style="background-color:var(--surface); background-image:${bgCss(b)}; background-size:${b.cover?'cover':(b.size||'auto')};"></span><span class="optname">${esc(b.name)}</span></button>`).join("");
  sheet.innerHTML=`<h3 class="serif">Make it yours</h3><div class="lb">Text style</div><div class="optgrid">${fontOpts}</div><div class="lb" style="margin-top:16px;">Color theme</div><div class="optgrid">${themeOpts}</div><div class="lb" style="margin-top:16px;">Background</div><div class="optgrid">${bgOpts}</div><div class="sheetactions"><button class="btn" id="sDone">Done</button></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.addEventListener("click",e=>{ if(e.target===overlay) close(); });
  sheet.querySelector("#sDone").onclick=close;
  sheet.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{ const kind=o.dataset.kind, idv=o.dataset.id; if(kind==="theme") applyTheme(idv); else if(kind==="bg") applyBg(idv); else applyFont(idv); sheet.querySelectorAll(`.opt[data-kind='${kind}']`).forEach(x=>x.classList.toggle("sel", x===o)); saveState(); });
}

/* recipe form */
function openForm(existing){
  const r=existing||{name:"",protein:"Chicken",meal:(state.mealView||"Dinner"),bakeType:"Cookies",tags:[],appliances:[],ingredients:[{name:"",qty:"",store:STORES[0],brand:""}],pinterest:"",notes:""};
  const overlay=document.createElement("div"); overlay.className="overlay"; const sheet=document.createElement("div"); sheet.className="sheet"; overlay.appendChild(sheet);
  sheet.innerHTML=`<h3 class="serif">${existing?"Edit recipe":"New recipe"}</h3>
    <label class="fld"><span class="lb">Recipe name</span><input id="fName" value="${esc(r.name)}" placeholder="What's it called?" /></label>
    <label class="fld"><span class="lb">Meal</span><select id="fMeal">${MEALS.map(m=>`<option ${m===(r.meal||"Dinner")?"selected":""}>${m}</option>`).join("")}</select></label>
    <label class="fld" id="fProteinWrap"><span class="lb">Protein</span><select id="fProtein">${PROTEINS.map(p=>`<option ${p===(r.protein||"Chicken")?"selected":""}>${p}</option>`).join("")}</select></label>
    <label class="fld" id="fBakeWrap"><span class="lb">Baking type</span><select id="fBakeType">${BAKETYPES.map(b=>`<option ${b===(r.bakeType||"Cookies")?"selected":""}>${b}</option>`).join("")}</select></label>
    <div class="fld"><span class="lb">Photo (optional)</span>
      <img id="fPhotoPrev" alt="" style="width:100%;height:170px;object-fit:cover;border-radius:10px;display:none;margin-bottom:8px;">
      <div class="row" style="gap:8px;"><button type="button" class="ghost" id="fPhotoBtn" style="flex:1;">📷 Choose a photo</button><button type="button" class="ghost" id="fPhotoDel" style="display:none; color:var(--danger);">Remove</button></div>
      <input type="file" accept="image/*" id="fPhotoInput" style="display:none;"></div>
    <div class="fld"><span class="lb">Needs swaps?</span><div class="tagpick" id="fTags">${TAGS.map(t=>`<button type="button" class="chip ${t.type} ${r.tags.includes(t.id)?'on':''}" data-tag="${t.id}">${esc(t.label)}</button>`).join("")}</div></div>
    <div class="fld"><span class="lb">Kitchen toys (optional)</span>${state.appliances.length?`<div class="tagpick" id="fTools">${state.appliances.map(a=>`<button type="button" class="chip tool ${(r.appliances||[]).includes(a)?'on':''}" data-tool="${esc(a)}">${esc(a)}</button>`).join("")}</div>`:`<div class="muted" style="font-size:13px;">Add your toys in the Kitchen tab to tag recipes here.</div>`}</div>
    <div class="fld"><span class="lb">Ingredients &amp; where to buy them</span><div id="fIngs"></div><button type="button" class="ghost tiny" id="addIng" style="margin-top:4px;">＋ Add ingredient</button></div>
    <label class="fld"><span class="lb">Pinterest link (optional)</span><input id="fPin" value="${esc(r.pinterest||"")}" placeholder="https://pinterest.com/..." inputmode="url" /></label>
    <label class="fld"><span class="lb">Notes (optional)</span><textarea id="fNotes" placeholder="Cooking notes, texture/spice reminders...">${esc(r.notes||"")}</textarea></label>
    <div class="sheetactions"><button class="ghost" id="fCancel" style="flex:none;">Cancel</button>${existing?'<button class="ghost" id="fDelete" style="flex:none; color:var(--danger);">Delete</button>':''}<button class="btn" id="fSave">Save recipe</button></div>`;
  document.body.appendChild(overlay);
  const ingWrap=sheet.querySelector("#fIngs");
  function ingRow(ing){ const div=document.createElement("div"); div.className="ingrow"; div.innerHTML=`<input class="i-name" placeholder="Ingredient" value="${esc(ing.name)}" /><button type="button" class="del" title="remove">✕</button><div class="g2"><input class="i-qty" placeholder="Qty (e.g. 1 lb)" value="${esc(ing.qty)}" /><input class="i-brand" placeholder="Brand (optional)" value="${esc(ing.brand||"")}" /></div><select class="i-store" style="grid-column:1 / -1;">${STORES.map(s=>`<option ${s===ing.store?"selected":""}>${s}</option>`).join("")}</select>`; div.querySelector(".del").onclick=()=>{ if(ingWrap.children.length>1) div.remove(); else div.querySelectorAll("input").forEach(i=>i.value=""); }; return div; }
  (r.ingredients.length?r.ingredients:[{name:"",qty:"",store:STORES[0],brand:""}]).forEach(i=>ingWrap.appendChild(ingRow(i)));
  sheet.querySelector("#addIng").onclick=()=>ingWrap.appendChild(ingRow({name:"",qty:"",store:STORES[0],brand:""}));
  sheet.querySelectorAll("#fTags .chip").forEach(c=>c.onclick=()=>c.classList.toggle("on"));
  sheet.querySelectorAll("#fTools .chip").forEach(c=>c.onclick=()=>c.classList.toggle("on"));
  let pendingPhoto=(existing&&photos[existing.id])?photos[existing.id]:null; let photoDirty=false;
  const _prev=sheet.querySelector("#fPhotoPrev"), _del=sheet.querySelector("#fPhotoDel"), _fi=sheet.querySelector("#fPhotoInput");
  function refreshPhoto(){ if(pendingPhoto){ _prev.src=pendingPhoto; _prev.style.display="block"; _del.style.display="inline-flex"; } else { _prev.style.display="none"; _del.style.display="none"; } }
  refreshPhoto();
  sheet.querySelector("#fPhotoBtn").onclick=()=>_fi.click();
  _fi.onchange=async()=>{ const f=_fi.files&&_fi.files[0]; if(!f) return; try{ pendingPhoto=await compressImage(f); photoDirty=true; refreshPhoto(); }catch(e){ toast("Couldn't load that image"); } };
  _del.onclick=()=>{ pendingPhoto=null; photoDirty=true; refreshPhoto(); };
  const _pw=sheet.querySelector("#fProteinWrap"), _bw=sheet.querySelector("#fBakeWrap"), _meal=sheet.querySelector("#fMeal");
  function refreshMeal(){ const bake=_meal.value==="Baking"; _pw.style.display=bake?"none":"block"; _bw.style.display=bake?"block":"none"; }
  _meal.onchange=refreshMeal; refreshMeal();
  const close=()=>overlay.remove();
  overlay.addEventListener("click",e=>{ if(e.target===overlay) close(); });
  sheet.querySelector("#fCancel").onclick=close;
  if(existing) sheet.querySelector("#fDelete").onclick=()=>{ state.recipes=state.recipes.filter(x=>x.id!==existing.id); state.weekMeals=state.weekMeals.filter(m=>m.recipeId!==existing.id); removePhoto(existing.id); close(); saveState(); render(); };
  sheet.querySelector("#fSave").onclick=()=>{ const name=sheet.querySelector("#fName").value.trim(); if(!name){ sheet.querySelector("#fName").focus(); return; }
    const ings=[...ingWrap.children].map(div=>({name:div.querySelector(".i-name").value.trim(),qty:div.querySelector(".i-qty").value.trim(),store:div.querySelector(".i-store").value,brand:div.querySelector(".i-brand").value.trim()})).filter(i=>i.name);
    const tags=[...sheet.querySelectorAll("#fTags .chip.on")].map(c=>c.dataset.tag); const appliances=[...sheet.querySelectorAll("#fTools .chip.on")].map(c=>c.dataset.tool);
    const mealVal=_meal.value; const bakeVal=sheet.querySelector("#fBakeType").value; const protVal=(mealVal==="Baking")?"Other":sheet.querySelector("#fProtein").value;
    const rec={id:existing?existing.id:id(),name,meal:mealVal,protein:protVal,bakeType:bakeVal,tags,appliances,ingredients:ings,pinterest:sheet.querySelector("#fPin").value.trim(),notes:sheet.querySelector("#fNotes").value.trim(),favorite:existing?existing.favorite:false,photo:existing?(existing.photo||false):false,photoUrl:existing?(existing.photoUrl||""):""};
    if(photoDirty){ if(pendingPhoto){ rec.photo=true; savePhoto(rec.id,pendingPhoto); } else { rec.photo=false; removePhoto(rec.id); } }
    if(existing){ const i=state.recipes.findIndex(x=>x.id===existing.id); state.recipes[i]=rec; } else state.recipes.unshift(rec); close(); saveState(); render(); };
  setTimeout(()=>sheet.querySelector("#fName").focus(),50);
}

/* events */
document.getElementById("settingsBtn").addEventListener("click", openSettings);
document.getElementById("nav").addEventListener("click", e=>{ const b=e.target.closest("button[data-tab]"); if(!b) return; state.tab=b.dataset.tab; saveState(); render(); });
main.addEventListener("click", e=>{ const t=e.target.closest("[data-act]"); if(!t) return; const act=t.dataset.act;
  if(act==="add") return openForm(null);
  if(act==="edit") return openForm(recipeById(t.dataset.id));
  if(act==="fav"){ const r=recipeById(t.dataset.id); if(!r) return; r.favorite=!r.favorite; saveState(); if(state.tab==="favorites") renderFavorites(); else { t.classList.toggle("on", r.favorite); t.textContent=r.favorite?"★":"☆"; } return; }
  if(act==="filter"){ const f=t.dataset.id; state.filters=state.filters.includes(f)?state.filters.filter(x=>x!==f):[...state.filters,f]; saveState(); return renderRecipes(); }
  if(act==="clearfilters"){ state.filters=[]; saveState(); return renderRecipes(); }
  if(act==="mealview"){ state.mealView=t.dataset.id; saveState(); return renderRecipes(); }
  if(act==="roll"){ const list=state.recipes; if(!list.length) return; surprisePick=list[Math.floor(Math.random()*list.length)].id; return renderSurprise(); }
  if(act==="addtoy"){ const inp=document.getElementById("toyName"); const v=(inp.value||"").trim(); if(!v) return; if(!state.appliances.some(a=>a.toLowerCase()===v.toLowerCase())) state.appliances.push(v); saveState(); renderKitchen(); return toast(`Added ${v}`); }
  if(act==="removetoy"){ const toy=t.dataset.toy; state.appliances=state.appliances.filter(a=>a!==toy); state.recipes.forEach(r=>{ if(r.appliances) r.appliances=r.appliances.filter(a=>a!==toy); }); saveState(); return renderKitchen(); }
  if(act==="addweek"){ const r=recipeById(t.dataset.id); state.weekMeals.push({eid:id(),recipeId:t.dataset.id,day:""}); saveState(); return toast(r?`Added “${r.name}” to this week`:"Added to this week"); }
  if(act==="removemeal"){ state.weekMeals=state.weekMeals.filter(m=>m.eid!==t.dataset.eid); saveState(); return renderWeek(); }
  if(act==="clearweek"){ state.weekMeals=[]; saveState(); return renderWeek(); }
  if(act==="check"){ const k=t.dataset.key; if(state.checked[k]) delete state.checked[k]; else state.checked[k]=true; saveState(); return renderShop(); }
  if(act==="clearchecked"){ state.checked={}; saveState(); return renderShop(); }
  if(act==="addmanual"){ const inp=document.getElementById("mItem"); const v=inp.value.trim(); if(!v) return; state.manual.push({id:id(),name:v,store:document.getElementById("mStore").value}); saveState(); return renderShop(); }
  if(act==="delmanual"){ const mid=t.dataset.key.replace("M::",""); state.manual=state.manual.filter(m=>m.id!==mid); delete state.checked[t.dataset.key]; saveState(); return renderShop(); }
});
main.addEventListener("change", e=>{ const s=e.target.closest("select[data-act='setday']"); if(!s) return; const m=state.weekMeals.find(x=>x.eid===s.dataset.eid); if(m){ m.day=s.value; saveState(); renderWeek(); } });

/* boot */
(async function(){
  const loaded=await loadState();
  if(loaded){
    state=loaded;
    if(!state.appliances) state.appliances=["Crockpot","Instant Pot"];
    state.recipes.forEach(r=>{ if(!r.appliances) r.appliances=[]; });
    if(!state.weekMeals){ state.weekMeals=[]; if(state.plan){ DAYS.forEach(d=>(state.plan[d]||[]).forEach(rid=>state.weekMeals.push({eid:id(),recipeId:rid,day:d}))); } }
    delete state.plan; delete state.dayPickerFor;
    if(!state.filters) state.filters=[];
    if(!state.checked) state.checked={};
    if(!state.manual) state.manual=[];
    if(!state.tab) state.tab="recipes";
    if(!state.theme) state.theme="crimson";
    if(!state.bg) state.bg="wallpaper";
    if(!state.font) state.font="spooky";
    if(!state.bgV3){ state.bg="wallpaper"; state.theme="crimson"; state.font="spooky"; state.bgV3=true; }
  } else { state=seed(); }
  if(!state.importedIds) state.importedIds=[];
  let added=0;
  IMPORTS.forEach(rec=>{ if(!state.importedIds.includes(rec.importId)){ const {importId,...r}=rec; r.id=id(); state.recipes.unshift(r); state.importedIds.push(importId); added++; } });
  if(added) saveState();
  if(!state.airFryerV1){ if(!state.appliances.some(a=>a.toLowerCase()==="air fryer")) state.appliances.push("Air Fryer"); state.airFryerV1=true; saveState(); }
  if(!state.tagsV2){ state.recipes.forEach(r=>{ r.tags=(r.tags||[]).filter(t=>t==="adapt"); if(/tuscan mushroom/i.test(r.name)&&!r.tags.includes("adapt")) r.tags.push("adapt"); }); state.tagsV2=true; saveState(); }
  if(!state.proteinsV2){ state.recipes.forEach(r=>{ if(["Ground Beef","Ground Turkey","Ground Chicken","Ground Pork"].includes(r.protein)) r.protein="Ground Meat"; }); state.proteinsV2=true; saveState(); }
  if(!state.mealsV1){ state.recipes.forEach(r=>{ if(!r.meal) r.meal="Dinner"; if(!r.bakeType) r.bakeType="Cookies"; }); state.mealsV1=true; saveState(); }
  const PHOTOURLS={"Great Grandma's Sloppy Joes":"https://jawnsicooked.com/wp-content/uploads/2022/08/Sloppy-Joe-Recipe-Easy-Homemade-Classic.jpg","Creamy Tuscan Mushroom Pasta":"https://recipesbystella.com/wp-content/uploads/2025/10/mohamed_sf_realistic_Close-up_from_Reddit._This_delicious_and_fb1ce2c9-db2c-4a3e-8b99-c00d6a7261cb_1.png.webp"};
  if(!state.photoUrlV1){ state.recipes.forEach(r=>{ if(!r.photoUrl && !r.photo && PHOTOURLS[r.name]) r.photoUrl=PHOTOURLS[r.name]; }); state.photoUrlV1=true; saveState(); }
  if(!state.mealView) state.mealView="Dinner";
  await Promise.all(state.recipes.filter(r=>r.photo).map(r=>loadPhoto(r.id)));
  applyTheme(state.theme); applyFont(state.font); applyBg(state.bg);
  render();
})();
</script>
</body>
